[tool.hubuum_docs]
versioned = true

# Repair historical source links only when the replacement exists in that tag.
[tool.hubuum_docs.link_migrations]
"src/tests/api/v1/imports.rs" = "tests/api_jobs_suite/imports.rs"
"src/tests/api/meta.rs" = "tests/api_platform_suite/meta.rs"
