[project]
site_name = "Hubuum documentation"
site_description = "Model your assets, operate Hubuum, and build integrations with its API, clients, CLI, and web frontend."
# Base URL. scripts/docs.sh appends the selected edition (main or vX.Y.Z).
site_url = "https://hubuum.github.io/hubuum/"
repo_url = "https://github.com/hubuum/hubuum"
repo_name = "hubuum/hubuum"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "target/docs-site"
strict = true
extra_css = ["https://hubuum.github.io/assets/stylesheets/hubuum.css"]
extra_javascript = ["assets/javascripts/versions.js"]
copyright = "Hubuum · MIT licensed"

