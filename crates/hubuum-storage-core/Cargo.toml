[package]
name = "hubuum-storage-core"
version = "0.1.0"
edition = "2024"
description = "Backend-neutral storage contracts and diagnostics for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
async-trait = "0.1"
hubuum-domain = { path = "../hubuum-domain" }
hubuum-events-core = { path = "../hubuum-events-core" }
serde_json = "1"
uuid = "1"
