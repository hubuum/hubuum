[package]
name = "hubuum-storage-core"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "Backend-neutral storage contracts and diagnostics for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
readme = "../../docs/rust_api/hubuum-storage-core.md"
publish = true

[package.metadata.hubuum]
rust-api = "experimental-public"
policy-document = "docs/rust_api/hubuum-storage-core.md"
release-train = "storage-sdk"

[dependencies]
hubuum-budget = { version = "=0.8.0", path = "../hubuum-budget" }
async-trait = "0.1"
base64 = "0.23"
chrono = "0.4"
hubuum-computed-fields = { version = "=0.8.0", path = "../hubuum-computed-fields" }
hubuum-domain = { version = "=0.8.0", path = "../hubuum-domain" }
hubuum-events-core = { version = "=0.8.0", path = "../hubuum-events-core" }
hubuum-query = { version = "=0.8.0", path = "../hubuum-query" }
hubuum-task-core = { version = "=0.8.0", path = "../hubuum-task-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
uuid = "1"
utoipa = { version = "6", optional = true }

[features]
openapi = ["dep:utoipa", "hubuum-domain/openapi"]

[dev-dependencies]
rstest = "0.28"
