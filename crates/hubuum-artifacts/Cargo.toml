[package]
name = "hubuum-artifacts"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Bounded artifact verification and immutable byte-store contracts for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
hubuum-storage-core = { path = "../hubuum-storage-core" }
hubuum-budget = { path = "../hubuum-budget" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
async-trait = "0.1"
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"], optional = true }
aws-smithy-http-client = { version = "=1.1.9", features = ["rustls-aws-lc"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }

[features]
s3 = ["dep:aws-sdk-s3", "dep:aws-smithy-http-client", "dep:serde", "dep:serde_json", "dep:sha2", "dep:url", "dep:uuid", "dep:rustls-pki-types", "dep:rustls"]

[dev-dependencies]
sha2 = "0.11"
rstest = "0.28"
tokio = { version = "1", features = ["macros", "rt", "time"] }
criterion = "0.8.2"

[[bench]]
name = "s3_artifact_storage_criterion"
harness = false
required-features = ["s3"]
