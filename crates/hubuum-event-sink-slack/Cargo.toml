[package]
name = "hubuum-event-sink-slack"
version = "0.0.1"
edition = "2024"
description = "Shared event notification support for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
hubuum-event-rendering = { path = "../hubuum-event-rendering" }
hubuum-event-sinks-common = { path = "../hubuum-event-sinks-common" }
hubuum-event-sinks-http = { path = "../hubuum-event-sinks-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
rstest = "0.26"

hubuum-events-core = { path = "../hubuum-events-core" }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
