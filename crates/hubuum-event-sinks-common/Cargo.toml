[package]
name = "hubuum-event-sinks-common"
version = "0.0.1"
edition = "2024"
description = "Transport-neutral event sink helpers for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
hubuum-events-core = { path = "../hubuum-events-core" }
hubuum-secrets = { path = "../hubuum-secrets" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
