[package]
name = "hubuum-auth-core"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
chrono = "0.4"
hubuum-domain = { version = "=0.9.0", path = "../hubuum-domain" }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"

[dev-dependencies]
rstest = "0.28"
uuid = "1"
