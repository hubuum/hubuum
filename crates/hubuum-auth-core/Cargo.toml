[package]
name = "hubuum-auth-core"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
hubuum-domain = { version = "=0.11.0", path = "../hubuum-domain" }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hubuum-outbound-http = { path = "../hubuum-outbound-http" }
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["sync", "time"] }
