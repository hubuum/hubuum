[package]
name = "hubuum-computed-fields"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Typed, deterministic computed-field evaluation for Hubuum"
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
readme = "../../docs/rust_api/hubuum-computed-fields.md"
publish = true

[package.metadata.hubuum]
rust-api = "experimental-public"
policy-document = "docs/rust_api/hubuum-computed-fields.md"
release-train = "storage-sdk"

[dependencies]
bigdecimal = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"

[dev-dependencies]
rstest = "0.26"
