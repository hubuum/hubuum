[package]
name = "hubuum-auth-oauth"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
base64 = "0.22"
chrono = "0.4"
hubuum-auth-core = { path = "../hubuum-auth-core" }
hubuum-domain = { version = "=0.11.0", path = "../hubuum-domain" }
hubuum-secrets = { path = "../hubuum-secrets" }
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["time"] }
url = "2.5.9"

[dev-dependencies]
rstest = "0.28"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt"] }
