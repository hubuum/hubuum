[package]
name = "hubuum-templates"
version = "0.0.1"
edition = "2024"
description = "Bounded MiniJinja template helpers for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
tempfile = "3"
hubuum-budget = { path = "../hubuum-budget" }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
minijinja = { version = "3", features = ["fuel", "serde"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rstest = "0.28"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
gungraun = "0.20.0"

[[bench]]
name = "size_limited_writer_callgrind"
harness = false

[[bin]]
name = "hubuum-template-worker"
path = "src/bin/hubuum-template-worker.rs"
