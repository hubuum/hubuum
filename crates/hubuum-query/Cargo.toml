[package]
name = "hubuum-query"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "App-neutral query parsing and search parameter types for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
readme = "../../docs/rust_api/hubuum-query.md"
publish = true

[package.metadata.hubuum]
rust-api = "experimental-public"
policy-document = "docs/rust_api/hubuum-query.md"
release-train = "storage-sdk"

[dependencies]
base64 = "0.23"
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
rstest = "0.26"
gungraun = "0.19.4"

[[bench]]
name = "parse_query_parameter_callgrind"
harness = false

[[bench]]
name = "parse_integer_list_callgrind"
harness = false

[[bench]]
name = "search_operator_parsing_callgrind"
harness = false

[[bench]]
name = "jsonb_type_inference_callgrind"
harness = false
