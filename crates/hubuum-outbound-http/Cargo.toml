[package]
name = "hubuum-outbound-http"
version = "0.0.1"
edition = "2024"
description = "Hardened outbound HTTP helpers for Hubuum."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
publish = false

[package.metadata.hubuum]
rust-api = "workspace-internal"

[dependencies]
ipnet = "2.12"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
