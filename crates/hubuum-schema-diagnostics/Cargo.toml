[package]
name = "hubuum-schema-diagnostics"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded, value-redacted repair diagnostics for jsonschema validation errors."
license = "MIT"
repository = "https://github.com/hubuum/hubuum"
readme = "../../docs/rust_api/hubuum-schema-diagnostics.md"
publish = true

[package.metadata.hubuum]
rust-api = "experimental-public"
policy-document = "docs/rust_api/hubuum-schema-diagnostics.md"
release-train = "storage-sdk"

[dependencies]
jsonschema = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
utoipa = { version = "6", optional = true }

[features]
openapi = ["dep:utoipa"]

[dev-dependencies]
rstest = "0.27"
