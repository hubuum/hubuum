[package]
name = "hubuum"
version = "0.0.11"
edition = "2024"
description = "Flexible asset management REST service."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hubuum/hubuum"
homepage = "https://github.com/hubuum/hubuum"
documentation = "https://github.com/hubuum/hubuum"
keywords = ["asset-management", "cmdb", "rest", "api"]
categories = ["web-programming::http-server"]
publish = false

[package.metadata.hubuum]
rust-api = "internal-application"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "crates/hubuum-auth-core",
    "crates/hubuum-auth-ldap",
    "crates/hubuum-computed-fields",
    "crates/hubuum-domain",
    "crates/hubuum-event-sink-amqp",
    "crates/hubuum-event-sink-email",
    "crates/hubuum-event-sink-valkey",
    "crates/hubuum-event-sink-webhook",
    "crates/hubuum-event-sinks-common",
    "crates/hubuum-events-core",
    "crates/hubuum-outbound-http",
    "crates/hubuum-query",
    "crates/hubuum-scale-benchmark",
    "crates/hubuum-scale-core",
    "crates/hubuum-secrets",
    "crates/hubuum-storage-core",
    "crates/hubuum-storage-conformance",
    "crates/hubuum-storage-memory",
    "crates/hubuum-storage-postgres",
    "crates/hubuum-task-core",
    "crates/hubuum-templates",
]

[dependencies]
actix-rt = "2"
actix-service = "2"
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-http = { version = "3", default-features = false }
argon2 = "0.6.0-rc.8"
async-trait = "0.1"
bytes = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["env", "derive"] }
diesel = { version = "2", features = [
    "postgres",
    "serde_json",
    "chrono",
    "64-column-tables",
    "uuid",
] }
diesel-async = { version = "0.9.2", features = ["postgres", "bb8"] }
ipnet = "2.12"
futures = "0.3"
futures-util = "0.3"
json-patch = { version = "4.2", default-features = false, features = ["utoipa"] }
rand = "0.10"
# The OpenTelemetry SDK's default BatchSpanProcessor exports on a dedicated
# non-Tokio thread, so its custom OTLP client must use reqwest's blocking API;
# provider construction and shutdown are moved onto blocking workers too.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
redis = { version = "1.3.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
hmac = "0.13"
hubuum-auth-core = { path = "crates/hubuum-auth-core" }
hubuum-auth-ldap = { path = "crates/hubuum-auth-ldap" }
hubuum-computed-fields = { path = "crates/hubuum-computed-fields" }
hubuum-domain = { path = "crates/hubuum-domain", features = ["openapi"] }
hubuum-event-sink-amqp = { path = "crates/hubuum-event-sink-amqp", optional = true }
hubuum-event-sink-email = { path = "crates/hubuum-event-sink-email", optional = true }
hubuum-event-sink-valkey = { path = "crates/hubuum-event-sink-valkey", optional = true }
hubuum-event-sink-webhook = { path = "crates/hubuum-event-sink-webhook" }
hubuum-event-sinks-common = { path = "crates/hubuum-event-sinks-common" }
hubuum-templates = { path = "crates/hubuum-templates" }
hubuum-events-core = { path = "crates/hubuum-events-core", features = ["schema"] }
hubuum-outbound-http = { path = "crates/hubuum-outbound-http" }
hubuum-query = { path = "crates/hubuum-query" }
hubuum-secrets = { path = "crates/hubuum-secrets" }
hubuum-storage-core = { path = "crates/hubuum-storage-core" }
hubuum-storage-memory = { path = "crates/hubuum-storage-memory" }
hubuum-storage-postgres = { path = "crates/hubuum-storage-postgres" }
hubuum-task-core = { path = "crates/hubuum-task-core" }
minijinja = { version = "2", features = ["loader", "fuel"] }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    # Required by the default thread-based BatchSpanProcessor; the async client
    # expects a Tokio reactor that is not present on the exporter thread. The
    # blocking client lifecycle is kept off Hubuum's async runtime.
    "reqwest-blocking-client",
    "trace",
] }
opentelemetry-prometheus = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
    "metrics",
    "trace",
] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-serde = "0"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "chrono",
    "json",
] }
utoipa = { version = "5", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = [
    "actix-web",
    "vendored",
], optional = true }
urlparse = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
rustls = { version = "0.23", features = ["aws-lc-rs", "ring"] }
prometheus = "0.14"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
openssl = { version = "0.10.80", optional = true }
lru = "0.18.0"
# Treetop's client API is pre-1.0; review each version bump explicitly.
treetop-client = { version = "0.0.3", optional = true }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8.2"
gungraun = "0.19.4"
hubuum-storage-conformance = { path = "crates/hubuum-storage-conformance" }
hubuum-storage-postgres = { path = "crates/hubuum-storage-postgres", features = ["integration-test-support", "query-capture"] }
percent-encoding = "2"
regex = "1"
rstest = "0.26"
tokio-rustls = "0.26"

[features]
default = ["swagger-ui", "login-rate-limit-valkey"]
amqp = ["dep:hubuum-event-sink-amqp"]
email = ["dep:hubuum-event-sink-email"]
swagger-ui = ["dep:utoipa-swagger-ui"]
tls-rustls = ["actix-web/rustls-0_23"]
tls-openssl = ["dep:openssl", "actix-web/openssl"]
login-rate-limit-valkey = ["dep:redis"]
valkey = ["dep:hubuum-event-sink-valkey", "login-rate-limit-valkey"]
permissions-treetop = ["dep:treetop-client"]
embedded-migrations = ["hubuum-storage-postgres/embedded-migrations"]
vendored-openssl = ["openssl/vendored"]
# Test/diagnostic-only Diesel instrumentation used by PostgreSQL query-budget
# checks. Keeping this opt-in avoids adding instrumentation work to production
# pool checkouts.
query-capture = ["hubuum-storage-postgres/query-capture"]
# Enables the opt-in PostgreSQL Criterion target and its embedded migrations.
# The benchmark provisions its own disposable database outside the measured
# region so the shared benchmark action can discover and run it directly.
postgres-bench = [
    "hubuum-storage-postgres/benchmark-support",
    "hubuum-storage-postgres/embedded-migrations",
]
# Enables the opt-in end-to-end runtime behavior validator. It starts real
# server processes and enforces operational budgets rather than benchmarking a
# library function, so it is intentionally a binary instead of a Cargo bench.
runtime-behavior-check = ["hubuum-storage-postgres/benchmark-support"]
production-all = [
    "amqp",
    "email",
    "swagger-ui",
    "tls-rustls",
    "tls-openssl",
    "valkey",
    "permissions-treetop",
    "embedded-migrations",
    "vendored-openssl",
]
integration-test-support = [
    "hubuum-storage-postgres/integration-test-support",
    "hubuum-storage-postgres/query-capture",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"

[lib]
name = "hubuum"
path = "src/lib.rs"


[[bin]]
name = "hubuum-server"
path = "src/main.rs"

[[bin]]
name = "hubuum-admin"
path = "src/bin/admin.rs"
test = false

[[bin]]
name = "hubuum-openapi"
path = "src/bin/openapi.rs"
test = false

[[bin]]
name = "hubuum-operational-contracts"
path = "src/bin/operational_contracts.rs"
test = false
required-features = ["embedded-migrations"]

[[bin]]
name = "hubuum-runtime-behavior-check"
path = "src/bin/runtime_behavior_check.rs"
test = false
required-features = ["runtime-behavior-check"]

[[test]]
name = "api_core_data"
path = "tests/api_core_data.rs"
required-features = ["integration-test-support"]

[[test]]
name = "api_identity"
path = "tests/api_identity.rs"
required-features = ["integration-test-support"]

[[test]]
name = "api_jobs"
path = "tests/api_jobs.rs"
required-features = ["integration-test-support"]

[[test]]
name = "api_platform"
path = "tests/api_platform.rs"
required-features = ["integration-test-support"]

[[test]]
name = "restore_roundtrip"
path = "tests/restore_roundtrip.rs"
required-features = ["integration-test-support"]

[[test]]
name = "admin_cli"
path = "tests/admin_cli.rs"
required-features = ["integration-test-support"]

[[bench]]
name = "json_predicate_construction_callgrind"
harness = false

[[bench]]
name = "database_url_parsing_criterion"
harness = false

[[bench]]
name = "object_validation_geo_callgrind"
harness = false

[[bench]]
name = "object_validation_nested_callgrind"
harness = false

[[bench]]
name = "permissions_parsing_callgrind"
harness = false

[[bench]]
name = "token_storage_hash_callgrind"
harness = false

[[bench]]
name = "request_hash_callgrind"
harness = false

[[bench]]
name = "unified_search_query_parsing_callgrind"
harness = false

[[bench]]
name = "unified_search_cursor_callgrind"
harness = false

[[bench]]
name = "storage_collection_boundary_callgrind"
harness = false

[[bench]]
name = "password_hashing_criterion"
harness = false

[[bench]]
name = "tracing_criterion"
harness = false

[[bench]]
name = "storage_postgres_criterion"
harness = false
required-features = ["postgres-bench"]
