{% extends "base.html" %}

{% block announce %}
  {% if config.extra.docs_version == "main" %}
    <strong>Development documentation</strong> — may describe unreleased changes.
  {% else %}
    Documentation for <strong>{{ config.extra.docs_version }}</strong>.
  {% endif %}
  <label for="docs-version">Version</label>
  <select id="docs-version" data-version="{{ config.extra.docs_version }}"
    data-manifest="{{ '../versions.json' | url }}">
    <option value="{{ config.extra.docs_version }}">{{ config.extra.docs_version }}</option>
  </select>
{% endblock %}
