[graph]
all-features = true
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"
ignore = [
  # RUSTSEC-2026-0258 affects Actix's optional h2 0.3 dependency. Hubuum
  # disables the Actix HTTP/2 feature, so the vulnerable code is not compiled.
  # The package remains in Cargo.lock because Cargo records optional
  # dependencies. Remove this exception when Actix supports fixed h2 0.4.
  "RUSTSEC-2026-0258",
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "warn"
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = [
  { crate = "openssl-sys", deny-multiple-versions = true, reason = "Multiple OpenSSL FFI versions create patch and ABI ambiguity." },
  { crate = "ring", deny-multiple-versions = true, reason = "Multiple cryptographic implementations complicate vulnerability response." },
  { crate = "rustls", deny-multiple-versions = true, reason = "Multiple TLS implementations complicate vulnerability response." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
