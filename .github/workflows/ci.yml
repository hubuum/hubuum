name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ci:full' &&
      format('ignored-label-{0}', github.event.label.name) ||
      'validation'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRATE_NAME: hubuum
  GITHUB_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_rust_test
  HUBUUM_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_rust_test
  HUBUUM_DB_TEST_PASSWORD: postgres

jobs:
  changes:
    name: Classify changes
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (
        github.event_name != 'pull_request' ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ci:full'
      )
    runs-on: ubuntu-24.04
    outputs:
      markdown: ${{ steps.paths.outputs.markdown }}
      code: ${{ steps.paths.outputs.code }}
      openapi: ${{ steps.paths.outputs.openapi }}
      container: ${{ steps.paths.outputs.container }}
      artifacts: ${{ steps.paths.outputs.artifacts }}
      run_format: ${{ steps.policy.outputs.run_format }}
      run_markdown: ${{ steps.policy.outputs.run_markdown }}
      run_default_suite: ${{ steps.policy.outputs.run_default_suite }}
      run_full_ci: ${{ steps.policy.outputs.run_full_ci }}
      run_openapi: ${{ steps.policy.outputs.run_openapi }}
      run_container: ${{ steps.policy.outputs.run_container }}
      feature_matrix: ${{ steps.policy.outputs.feature_matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test change classifier
        run: bash scripts/test-classify-ci-changes.sh
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          changed_files=()
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            while IFS= read -r -d '' path; do
              changed_files+=("$path")
            done < <(git ls-files --cached --others --exclude-standard -z)
          else
            while IFS= read -r -d '' path; do
              changed_files+=("$path")
            done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi
          bash scripts/classify-ci-changes.sh "${changed_files[@]}"
      - name: Select CI tier
        id: policy
        env:
          CODE_CHANGED: ${{ steps.paths.outputs.code }}
          CONTAINER_CHANGED: ${{ steps.paths.outputs.container }}
          OPENAPI_CHANGED: ${{ steps.paths.outputs.openapi }}
          MARKDOWN_CHANGED: ${{ steps.paths.outputs.markdown }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          full_requested=false
          if [[ "$IS_PULL_REQUEST" != "true" || "$IS_DRAFT" != "true" || "$FORCE_FULL" == "true" ]]; then
            full_requested=true
          fi

          run_full_ci=false
          if [[ "$full_requested" == "true" && ("$CODE_CHANGED" == "true" || "$FORCE_FULL" == "true") ]]; then
            run_full_ci=true
          fi

          run_default_suite=false
          if [[ "$CODE_CHANGED" == "true" || "$FORCE_FULL" == "true" ]]; then
            run_default_suite=true
          fi

          run_container=false
          if [[ "$full_requested" == "true" && ("$CONTAINER_CHANGED" == "true" || "$FORCE_FULL" == "true") ]]; then
            run_container=true
          fi

          run_openapi=false
          if [[ "$run_full_ci" == "true" || "$OPENAPI_CHANGED" == "true" ]]; then
            run_openapi=true
          fi

          run_format=false
          if [[ "$CODE_CHANGED" == "true" || "$FORCE_FULL" == "true" ]]; then
            run_format=true
          fi

          run_markdown=false
          if [[ "$MARKDOWN_CHANGED" == "true" || "$FORCE_FULL" == "true" ]]; then
            run_markdown=true
          fi

          if [[ "$run_full_ci" == "true" ]]; then
            feature_matrix='[{"name":"default","args":""},{"name":"no-default-features","args":"--no-default-features"},{"name":"rustls-no-openssl","args":"--no-default-features -F tls-rustls"},{"name":"all-features","args":"--all-features"}]'
          else
            feature_matrix='[{"name":"default","args":""}]'
          fi

          {
            echo "run_format=$run_format"
            echo "run_markdown=$run_markdown"
            echo "run_default_suite=$run_default_suite"
            echo "run_full_ci=$run_full_ci"
            echo "run_openapi=$run_openapi"
            echo "run_container=$run_container"
            echo "feature_matrix=$feature_matrix"
          } >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.run_format == 'true' || needs.changes.outputs.run_markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Rust formatting
        if: needs.changes.outputs.run_format == 'true'
        run: cargo fmt --all -- --check
      - name: Markdown lint
        if: needs.changes.outputs.run_markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          config: '.markdownlint.json'
          globs: '**/*.md'

  dependency-policy:
    name: Rust dependency and license policy
    needs: changes
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.changes.outputs.code == 'true'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate immutable inputs and exception metadata
        run: python3 scripts/check-supply-chain-policy.py
      - name: Test supply-chain policy validation
        run: python3 scripts/test-supply-chain-policy.py
      - name: Test release SBOM composition
        run: bash scripts/test-generate-release-sbom.sh
      - name: Test container evidence input validation
        run: bash scripts/test-generate-container-evidence.sh
      - name: Audit dependencies
        id: dependency_audit
        continue-on-error: true
        run: bash scripts/run-cargo-deny.sh cargo-deny.log
      - name: Retain dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-deny-${{ github.run_id }}
          path: cargo-deny.log
          if-no-files-found: error
          retention-days: 90
      - name: Enforce dependency audit result
        if: steps.dependency_audit.outcome != 'success'
        run: exit 1

  rust-api-policy:
    name: Rust API policy
    needs: changes
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.changes.outputs.code == 'true'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate Rust API classifications
        run: python3 scripts/check-rust-api-policy.py
      - name: Test Rust API classification policy
        run: python3 scripts/test-rust-api-policy.py
      - name: Test Rust API registry baseline detection
        run: python3 scripts/test-crates-io-baseline.py
      - name: Select supported Rust packages
        id: supported
        run: |
          packages="$(python3 scripts/check-rust-api-policy.py --supported-packages)"
          {
            echo 'packages<<EOF'
            echo "$packages"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Install semantic compatibility checker
        if: steps.supported.outputs.packages != ''
        run: bash scripts/install-cargo-semver-checks.sh
      - name: Verify supported Rust packages
        if: steps.supported.outputs.packages != ''
        env:
          SUPPORTED_PACKAGES: ${{ steps.supported.outputs.packages }}
        run: |
          echo '### Rust API registry baselines' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps --all-features --package "$package"
            cargo package --locked --package "$package"
            baseline="$(python3 scripts/check-crates-io-baseline.py "$package")"
            case "$baseline" in
              present)
                cargo semver-checks --package "$package"
                echo "- \`$package\`: checked against its latest crates.io release" >> "$GITHUB_STEP_SUMMARY"
                ;;
              missing)
                echo "::notice title=No Rust API registry baseline::$package has no crates.io release; compatibility checks begin after its first release"
                echo "- \`$package\`: no crates.io release yet; recorded as an initial public release" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "Unexpected registry baseline result for $package: $baseline" >&2
                exit 1
                ;;
            esac
          done <<< "$SUPPORTED_PACKAGES"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install clippy
        run: rustup component add clippy
      - name: Install feature build dependencies
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes libssl-dev
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run clippy with all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check Docker workspace manifest parity
        run: cargo test --bin hubuum-server dockerfile_copies_every_workspace_manifest --locked
      - name: Test deployment script refresh
        run: bash scripts/test-install-script-refresh.sh
      - name: Test single-host rolling update
        run: bash scripts/test-single-host-rollout.sh
      - name: Test migration compatibility policy
        run: |
          bash scripts/test-migration-compatibility.sh
          bash scripts/check-migration-compatibility.sh

  release-metadata:
    name: Release metadata
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Make release scripts executable
        run: chmod +x scripts/*.sh
      - name: Check version bump hygiene
        run: ./scripts/check-version-bump.sh

  openapi-contract:
    name: OpenAPI contract
    needs: changes
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.changes.outputs.run_openapi == 'true'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Prepare OpenAPI report directory
        run: mkdir -p openapi-contract
      - name: Generate OpenAPI JSON
        id: generate_openapi
        continue-on-error: true
        run: cargo run --quiet --bin hubuum-openapi --locked > openapi-contract/generated.json
      - name: Validate OpenAPI semantics
        id: openapi_semantics
        continue-on-error: true
        run: "cargo test --lib 'api::openapi::tests::' --locked"
      - name: Check OpenAPI drift
        id: openapi_drift
        if: steps.generate_openapi.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if diff -u docs/openapi.json openapi-contract/generated.json > openapi-contract/exact-drift.diff; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            diff_status=$?
            if [[ "$diff_status" -ne 1 ]]; then
              exit "$diff_status"
            fi
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install checksum-pinned oasdiff
        id: install_oasdiff
        continue-on-error: true
        run: |
          set -euo pipefail
          binary="$(scripts/install-oasdiff.sh "$RUNNER_TEMP/oasdiff")"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          {
            "$binary" --version
            printf 'sha256 '
            sha256sum "$binary" | awk '{print $1}'
          } > openapi-contract/oasdiff-version.txt
      - name: Test OpenAPI compatibility policy
        id: test_openapi_policy
        if: steps.install_oasdiff.outcome == 'success'
        continue-on-error: true
        env:
          OASDIFF_BIN: ${{ steps.install_oasdiff.outputs.binary }}
        run: scripts/test-openapi-compatibility.sh
      - name: Resolve previous stable OpenAPI baseline
        id: resolve_openapi_baseline
        if: steps.generate_openapi.outcome == 'success'
        continue-on-error: true
        run: scripts/resolve-openapi-baseline.sh openapi-contract
      - name: Check previous-release compatibility
        id: openapi_compatibility
        if: >-
          steps.generate_openapi.outcome == 'success' &&
          steps.install_oasdiff.outcome == 'success' &&
          steps.resolve_openapi_baseline.outcome == 'success'
        continue-on-error: true
        env:
          OASDIFF_BIN: ${{ steps.install_oasdiff.outputs.binary }}
        run: >-
          scripts/check-openapi-compatibility.sh
          openapi-contract/baseline.json
          openapi-contract/generated.json
          openapi-contract/baseline-metadata.json
          .github/openapi-breaking-exceptions.json
          CHANGELOG.md
          openapi-contract
      - name: Write OpenAPI workflow summary
        if: always()
        shell: bash
        run: |
          compatibility_status="not-run"
          if [[ -f openapi-contract/compatibility.json ]]; then
            compatibility_status="$(jq --raw-output '.status' openapi-contract/compatibility.json)"
          fi
          jq --null-input \
            --arg generation "${{ steps.generate_openapi.outcome }}" \
            --arg semantics "${{ steps.openapi_semantics.outcome }}" \
            --arg drift_step "${{ steps.openapi_drift.outcome }}" \
            --arg drift_found "${{ steps.openapi_drift.outputs.drift }}" \
            --arg compatibility_step "${{ steps.openapi_compatibility.outcome }}" \
            --arg compatibility_status "$compatibility_status" \
            '{
              generation: $generation,
              semantics: $semantics,
              drift: {step: $drift_step, found: ($drift_found == "true")},
              compatibility: {step: $compatibility_step, status: $compatibility_status}
            }' > openapi-contract/gate.json
          if [[ -f openapi-contract/summary.md ]]; then
            cat openapi-contract/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.openapi_drift.outputs.drift }}" == "true" ]]; then
            {
              echo "## Generated OpenAPI drift"
              echo
              echo "The generated document differs from the committed \`docs/openapi.json\`."
              echo
              echo "<details><summary>Exact diff (first 200 lines)</summary>"
              echo
              echo '```diff'
              sed -n '1,200p' openapi-contract/exact-drift.diff
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload OpenAPI contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-contract
          path: openapi-contract
          if-no-files-found: error
      - name: Enforce OpenAPI contract gate
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate_openapi.outcome }}
          SEMANTICS_OUTCOME: ${{ steps.openapi_semantics.outcome }}
          DRIFT_OUTCOME: ${{ steps.openapi_drift.outcome }}
          DRIFT_FOUND: ${{ steps.openapi_drift.outputs.drift }}
          INSTALL_OUTCOME: ${{ steps.install_oasdiff.outcome }}
          POLICY_TEST_OUTCOME: ${{ steps.test_openapi_policy.outcome }}
          BASELINE_OUTCOME: ${{ steps.resolve_openapi_baseline.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.openapi_compatibility.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=false
          for outcome in \
            "$GENERATE_OUTCOME" \
            "$SEMANTICS_OUTCOME" \
            "$DRIFT_OUTCOME" \
            "$INSTALL_OUTCOME" \
            "$POLICY_TEST_OUTCOME" \
            "$BASELINE_OUTCOME" \
            "$COMPATIBILITY_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              failed=true
            fi
          done
          if [[ "$DRIFT_FOUND" != "false" ]]; then
            failed=true
          fi
          if [[ "$failed" == "true" ]]; then
            echo "OpenAPI contract validation failed. Review the uploaded evidence." >&2
            exit 1
          fi

  feature-permutations:
    name: Feature smoke (${{ matrix.feature.name }})
    needs: changes
    if: needs.changes.outputs.run_default_suite == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.changes.outputs.feature_matrix) }}
    services:
      postgres:
        image: postgres:18.4@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install database libraries on Linux
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes libsqlite3-dev libmysqlclient-dev libpq-dev libssl-dev
      - name: Set up database
        run: |
          bash scripts/install-diesel-cli.sh
          DIESEL_BIN="${CARGO_HOME:-$HOME/.cargo}/bin/diesel"
          echo "Creating database"
          PGPASSWORD=postgres createdb -U postgres -h localhost -p 5432 hubuum_rust_test
          echo "Running database setup and migrations"
          "$DIESEL_BIN" migration run --database-url ${{ env.DATABASE_URL }}
          echo "Checking database setup"
          PGPASSWORD=postgres psql -U postgres -h localhost -p 5432 -d hubuum_rust_test -c "select * from users;"
      - name: Build (${{ matrix.feature.name }})
        run: cargo build ${{ matrix.feature.args }} --locked --release
      - name: Test (${{ matrix.feature.name }})
        run: cargo test ${{ matrix.feature.args }} -F integration-test-support --locked --release

  valkey-rate-limit-contract:
    name: Valkey login limiter contract
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-24.04
    services:
      valkey:
        image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run the shared limiter contract
        run: >-
          cargo test --locked --lib
          'middlewares::rate_limit::tests::' -- --ignored

  test:
    name: ${{ matrix.platform.os_name }}, rust ${{ matrix.toolchain }}
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ${{ matrix.platform.os }}
    env:
      # Production artifact jobs retain the exact fat-LTO release profile.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "off"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os_name: Linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - os_name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
        toolchain:
          - stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-08-04
        with:
          toolchain: ${{ matrix.toolchain }}
      
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ${{ matrix.platform.target }}-${{ matrix.toolchain }}-ci-test-release
      
      - name: Install Linux dependencies
        if: contains(matrix.platform.os, 'ubuntu')
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes libsqlite3-dev libmysqlclient-dev libpq-dev libssl-dev postgresql postgresql-client
          # Start postgres
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      
      - name: Install macOS dependencies
        if: contains(matrix.platform.os, 'macos')
        run: |
          brew install postgresql@17
          PG_BIN="$(brew --prefix postgresql@17)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          export PATH="$PG_BIN:$PATH"
          # Initialize and start postgres (creates user matching system user)
          brew services start postgresql@17
          # Wait for postgres to be ready
          max_attempts=30
          attempt=0
          until "$PG_BIN/pg_isready" -q || [ $attempt -eq $max_attempts ]; do
            echo "Waiting for PostgreSQL to be ready... (attempt $((attempt+1))/$max_attempts)"
            sleep 1
            attempt=$((attempt+1))
          done
          # Create postgres superuser with password
          "$PG_BIN/createuser" -s postgres
          "$PG_BIN/psql" -d postgres -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: Install Windows PostgreSQL libraries
        if: contains(matrix.platform.os, 'windows')
        shell: pwsh
        run: |
          choco install postgresql --params '"/Password:postgres"' --no-progress -y
          $pgRoot = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $pgRoot) { throw 'PostgreSQL installation directory not found' }
          $binPath = Join-Path $pgRoot.FullName 'bin'
          $libPath = Join-Path $pgRoot.FullName 'lib'
          if (-not (Test-Path (Join-Path $binPath 'pg_isready.exe'))) { throw "PostgreSQL client tools not found in $binPath" }
          if (-not (Test-Path (Join-Path $libPath 'libpq.lib'))) { throw "libpq.lib not found in $libPath" }
          "$binPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PG_BIN=$binPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8          

      - name: Set up database (Linux/macOS)
        if: "!contains(matrix.platform.os, 'windows')"
        run: |
          bash scripts/install-diesel-cli.sh
          DIESEL_BIN="${CARGO_HOME:-$HOME/.cargo}/bin/diesel"
          echo "Creating database"
          PGPASSWORD=postgres createdb -U postgres -h localhost -p 5432 hubuum_rust_test
          echo "Running database setup and migrations"
          "$DIESEL_BIN" migration run --database-url ${{ env.DATABASE_URL }}
          echo "Checking database setup"
          PGPASSWORD=postgres psql -U postgres -h localhost -p 5432 -d hubuum_rust_test -c "select * from users;"

      - name: Set up database (Windows)
        if: contains(matrix.platform.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PG_BIN) { throw 'PG_BIN is not set' }

          # Use an isolated cluster to avoid runner service credentials/state drift.
          $pgData = Join-Path $env:RUNNER_TEMP 'postgres-data'
          $pgLog = Join-Path $env:RUNNER_TEMP 'postgres.log'
          $pgPort = 55432

          if (Test-Path $pgData) {
            Remove-Item -Recurse -Force $pgData
          }

          & "$env:PG_BIN\initdb.exe" -D $pgData -U postgres -A trust --encoding=UTF8
          & "$env:PG_BIN\pg_ctl.exe" -D $pgData -l $pgLog -o "-p $pgPort" -w -t 60 start

          $isReady = $false
          $maxAttempts = 30
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & "$env:PG_BIN\pg_isready.exe" -q -h 127.0.0.1 -p $pgPort
            if ($LASTEXITCODE -eq 0) {
              $isReady = $true
              break
            }
            Write-Host "Waiting for PostgreSQL to be ready... (attempt $attempt/$maxAttempts)"
            Start-Sleep -Seconds 1
          }
          if (-not $isReady) { throw 'PostgreSQL did not become ready in time' }

          $dbUrl = "postgres://postgres@127.0.0.1:$pgPort/hubuum_rust_test"
          "DATABASE_URL=$dbUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HUBUUM_DATABASE_URL=$dbUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PG_TEST_PORT=$pgPort" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PG_LOG=$pgLog" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $dieselVersion = python3 scripts/check-supply-chain-policy.py --tool-value DIESEL_CLI_VERSION
          if (-not $dieselVersion) { throw 'DIESEL_CLI_VERSION is not configured' }
          cargo install --locked --force --version "=$dieselVersion" --no-default-features --features postgres diesel_cli
          $dieselBin = Join-Path $env:USERPROFILE '.cargo\bin\diesel.exe'
          if (-not (Test-Path $dieselBin)) { throw "Diesel CLI not found at $dieselBin" }
          $dieselDescription = & $dieselBin --version
          $dieselVersionCandidates = @(
            foreach ($line in $dieselDescription) {
              if ($line -match '^\s*Version:\s+(\d+\.\d+\.\d+)\s*$') {
                $Matches[1]
              } elseif ($line -match '^diesel\s+(\d+\.\d+\.\d+)\s*$') {
                $Matches[1]
              }
            }
          )
          if ($dieselVersionCandidates.Count -ne 1) {
            throw "Could not parse exactly one Diesel CLI version from: $($dieselDescription -join '; ')"
          }
          $installedDieselVersion = $dieselVersionCandidates[0]
          if ($installedDieselVersion -ne $dieselVersion) {
            throw "Unexpected Diesel CLI version $installedDieselVersion (expected $dieselVersion)"
          }
          $dieselLabel = "diesel $installedDieselVersion"
          $dieselDigest = (Get-FileHash $dieselBin -Algorithm SHA256).Hash.ToLower()
          Write-Host $dieselLabel
          Write-Host "diesel sha256:$dieselDigest"
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content $env:GITHUB_STEP_SUMMARY "- Diesel CLI: ``$dieselLabel``"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Diesel CLI executable: ``sha256:$dieselDigest``"
          }
          "DIESEL_BIN=$dieselBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & "$env:PG_BIN\createdb.exe" -U postgres -h 127.0.0.1 -p $pgPort hubuum_rust_test
          & $dieselBin migration run --database-url "$dbUrl"
          & "$env:PG_BIN\psql.exe" -U postgres -h 127.0.0.1 -p $pgPort -d hubuum_rust_test -c "select * from users;"
      
      - name: Build test configuration (non-Windows)
        if: "!contains(matrix.platform.os, 'windows')"
        run: >-
          cargo build --no-default-features
          -F production-all,integration-test-support
          --locked --release

      - name: Build test configuration (Windows)
        if: contains(matrix.platform.os, 'windows')
        run: >-
          cargo build
          -F tls-rustls,amqp,email,valkey,integration-test-support
          --locked --release --target ${{ matrix.platform.target }}
      
      - name: Run tests (non-Windows, production features)
        if: "!contains(matrix.platform.os, 'windows')"
        run: >-
          cargo test --no-default-features
          -F production-all,integration-test-support
          --locked --release

      - name: Run tests (Windows, full release feature set)
        if: contains(matrix.platform.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testArgs = @(
            'test',
            '-F', 'tls-rustls,amqp,email,valkey,integration-test-support',
            '--locked',
            '--release',
            '--target', '${{ matrix.platform.target }}'
          )

          & cargo @testArgs
          $firstExitCode = $LASTEXITCODE
          if ($firstExitCode -eq 0) {
            exit 0
          }

          Write-Warning "Windows tests failed with exit code $firstExitCode; resetting PostgreSQL and retrying once."
          if (Test-Path $env:PG_LOG) {
            Write-Host 'Last 200 lines of the PostgreSQL log:'
            Get-Content -Path $env:PG_LOG -Tail 200
          } else {
            Write-Warning "PostgreSQL log not found at $env:PG_LOG"
          }

          & "$env:PG_BIN\dropdb.exe" --if-exists --force -U postgres -h 127.0.0.1 -p $env:PG_TEST_PORT hubuum_rust_test
          if ($LASTEXITCODE -ne 0) { throw "dropdb failed with exit code $LASTEXITCODE" }

          & "$env:PG_BIN\createdb.exe" -U postgres -h 127.0.0.1 -p $env:PG_TEST_PORT hubuum_rust_test
          if ($LASTEXITCODE -ne 0) { throw "createdb failed with exit code $LASTEXITCODE" }

          & $env:DIESEL_BIN migration run --database-url $env:DATABASE_URL
          if ($LASTEXITCODE -ne 0) { throw "Diesel migrations failed with exit code $LASTEXITCODE" }

          & cargo @testArgs
          exit $LASTEXITCODE

  all-features-release-build:
    name: Release build with all production features
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install release build dependencies
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes libsqlite3-dev libmysqlclient-dev libpq-dev libssl-dev
      - name: Build release binaries with all production features
        run: cargo build --no-default-features -F production-all --locked --release

  container-build:
    name: Container build (production features)
    needs: changes
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
          needs.changes.outputs.run_container == 'true'
        )
      )
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env:
          POSTGRES_DB: hubuum_container_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hubuum_container_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build production container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: hubuum-server:ci
          build-args: |
            CARGO_BUILD_FLAGS=-F tls-rustls -F tls-openssl --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export static release binaries
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: release-artifacts
          outputs: type=local,dest=dist/release-smoke
          build-args: |
            CARGO_BUILD_FLAGS=-F tls-rustls -F tls-openssl --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - name: Verify exported release binaries
        run: |
          for binary in dist/release-smoke/hubuum-server dist/release-smoke/hubuum-admin; do
            if readelf --dynamic "$binary" | grep --quiet '(NEEDED)'; then
              echo "$binary unexpectedly has dynamic runtime dependencies" >&2
              readelf --dynamic "$binary" >&2
              exit 1
            fi
            "$binary" --version
          done
      - name: Test embedded database migrations and readiness
        env:
          IMAGE: hubuum-server:ci
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hubuum_container_test?sslmode=disable
        run: |
          docker run --rm --entrypoint hubuum-admin "$IMAGE" --help \
            | grep --quiet -- "--migrate"
          if docker run --rm --network host \
            --entrypoint hubuum-admin \
            --env HUBUUM_DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" --database-ready; then
            echo "database readiness unexpectedly accepted an unmigrated schema" >&2
            exit 1
          fi
          docker run --rm --network host \
            --entrypoint hubuum-admin \
            --env HUBUUM_DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" --migrate
          docker run --rm --network host \
            --entrypoint hubuum-admin \
            --env HUBUUM_DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" --database-ready
          test "$(docker run --rm --network host \
            --env PGPASSWORD=postgres \
            postgres:18.4@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4 psql \
            --host 127.0.0.1 \
            --username postgres \
            --dbname hubuum_container_test \
            --tuples-only \
            --no-align \
            --command "SELECT to_regclass('public.users') IS NOT NULL")" = "t"
          container_id="$(docker run --rm --detach --network host \
            --env HUBUUM_DATABASE_URL="$DATABASE_URL" \
            --env HUBUUM_BIND_IP=127.0.0.1 \
            "$IMAGE")"
          trap 'docker stop "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
      - name: Test live single-host zero-downtime rollout
        env:
          HUBUUM_TEST_IMAGE: hubuum-server:ci
          HUBUUM_OLD_TEST_IMAGE: ghcr.io/hubuum/hubuum-server:v0.0.1@sha256:061fc4cb3af57e2db06c33012db93e60834d4618815e30af4ebb4aa05a21f445
        run: bash scripts/test-single-host-zero-downtime.sh
      - name: Resolve adjacent stable release
        id: adjacent_release
        env:
          GH_TOKEN: ${{ github.token }}
          HUBUUM_COMPATIBILITY_REPORT: compatibility-report/release-metadata.json
        run: bash scripts/resolve-adjacent-release.sh
      - name: Test adjacent-release upgrade and application rollback
        env:
          HUBUUM_TEST_IMAGE: hubuum-server:ci
          HUBUUM_PREVIOUS_IMAGE: ${{ steps.adjacent_release.outputs.previous_image }}
          HUBUUM_PREVIOUS_RELEASE_TAG: ${{ steps.adjacent_release.outputs.previous_tag }}
          HUBUUM_COMPATIBILITY_REPORT_DIR: compatibility-report
        run: bash scripts/test-adjacent-release-upgrade.sh
      - name: Summarize adjacent-release compatibility
        if: always() && hashFiles('compatibility-report/report.json') != ''
        run: |
          {
            echo "### Adjacent-release compatibility"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | $(jq --raw-output '.result' compatibility-report/report.json) |"
            echo "| Previous release | $(jq --raw-output '.previous_release.tag' compatibility-report/report.json) |"
            echo "| Previous digest | $(jq --raw-output '.previous_release.digest' compatibility-report/report.json) |"
            echo "| Candidate SHA | $(jq --raw-output '.candidate.sha' compatibility-report/report.json) |"
            echo "| Migration seconds | $(jq --raw-output '.migration.seconds' compatibility-report/report.json) |"
            echo "| Maximum API latency | $(jq --raw-output '.migration.max_api_latency_seconds' compatibility-report/report.json) s |"
            echo "| Maximum observed outage | $(jq --raw-output '.migration.max_observed_api_outage_seconds' compatibility-report/report.json) s |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload adjacent-release compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adjacent-release-compatibility
          path: compatibility-report
          if-no-files-found: error

  ci-gate:
    name: >-
      ${{
        (
          (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'ci:full'
        ) && 'CI gate' || 'CI policy event ignored'
      }}
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      needs.changes.result != 'skipped'
    needs:
      - changes
      - static-checks
      - dependency-policy
      - rust-api-policy
      - lint
      - release-metadata
      - openapi-contract
      - feature-permutations
      - valkey-rate-limit-contract
      - test
      - all-features-release-build
      - container-build
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable CI jobs to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status \
            'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "$JOB_RESULTS"

  verify-tag-main-ci-success:
    name: Verify tagged commit already passed CI on main
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check for successful main CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${SHA}&status=completed&per_page=100"

          response="$(
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "$api"
          )"

          successful_run_count="$(
            jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length' <<<"$response"
          )"

          if [[ "$successful_run_count" -eq 0 ]]; then
            echo "No successful CI run on main was found for commit ${SHA}. Tag releases must point at a green main commit." >&2
            exit 1
          fi

          echo "Found successful CI run on main for ${SHA}"

  validate-tag-release:
    name: Validate tagged release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verify-tag-main-ci-success.result == 'success' &&
      needs.dependency-policy.result == 'success' &&
      needs.rust-api-policy.result == 'success' &&
      needs.openapi-contract.result == 'success' &&
      needs.container-build.result == 'success'
    needs:
      - verify-tag-main-ci-success
      - dependency-policy
      - rust-api-policy
      - openapi-contract
      - container-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-04
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Make release scripts executable
        run: chmod +x scripts/*.sh
      - name: Check release metadata
        run: ./scripts/check-release-readiness.sh "${GITHUB_REF_NAME}"

  build-tag-linux-artifacts:
    name: Build static release artifacts (${{ matrix.platform.name }})
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.validate-tag-release.result == 'success'
    needs: validate-tag-release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux-x86_64
            arch: amd64
            os_name: linux-x86_64
            runner: ubuntu-24.04
          - name: Linux-aarch64
            arch: arm64
            os_name: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Export stripped static binaries
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: release-artifacts
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=local,dest=dist/bin
          build-args: |
            CARGO_BUILD_FLAGS=--no-default-features --features production-all --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=static-${{ matrix.platform.os_name }}-all-features
          cache-to: type=gha,mode=max,scope=static-${{ matrix.platform.os_name }}-all-features
      - name: Verify static linkage and package release archive
        shell: bash
        run: |
          for binary in dist/bin/hubuum-server dist/bin/hubuum-admin; do
            if readelf --dynamic "$binary" | grep --quiet '(NEEDED)'; then
              echo "$binary unexpectedly has dynamic runtime dependencies" >&2
              readelf --dynamic "$binary" >&2
              exit 1
            fi
            "$binary" --version
          done
          archive_name="hubuum-${{ matrix.platform.os_name }}-all-features-${GITHUB_REF_NAME}.tar.gz"
          tar czvf "dist/${archive_name}" -C dist/bin hubuum-server hubuum-admin
          cd dist
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
          shasum -a 256 -c "${archive_name}.sha256"
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform.os_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  build-tag-native-artifacts:
    name: Build native release artifacts (${{ matrix.platform.name }})
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.validate-tag-release.result == 'success'
    needs: validate-tag-release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x86_64
            target: x86_64-pc-windows-msvc
            os_name: windows-x86_64
            runner: windows-latest
          - name: macOS-ARM64
            target: aarch64-apple-darwin
            os_name: macos-aarch64
            runner: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-04

      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.platform.target }}

      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ${{ matrix.platform.target }}-stable-release
      
      - name: Build release binaries (macOS, all production features)
        if: contains(matrix.platform.os_name, 'macos')
        env:
          HUBUUM_BUILD_GIT_SHA: ${{ github.sha }}
        run: cargo build --no-default-features -F production-all --locked --release --target ${{ matrix.platform.target }}

      - name: Build release binaries (Windows, self-contained feature set)
        if: contains(matrix.platform.os_name, 'windows')
        env:
          HUBUUM_BUILD_GIT_SHA: ${{ github.sha }}
        run: cargo build -F tls-rustls,amqp,email,valkey,embedded-migrations,vendored-openssl --locked --release --target ${{ matrix.platform.target }}

      - name: Verify macOS runtime dependencies
        if: contains(matrix.platform.os_name, 'macos')
        shell: bash
        run: |
          for binary in hubuum-server hubuum-admin; do
            binary_path="target/${{ matrix.platform.target }}/release/${binary}"
            "$binary_path" --version
            if xcrun otool -L "$binary_path" | grep --extended-regexp --quiet '(/opt/homebrew|/usr/local/opt|libpq|libssl|libcrypto)'; then
              echo "$binary unexpectedly depends on a package-manager library" >&2
              xcrun otool -L "$binary_path" >&2
              exit 1
            fi
          done

      - name: Verify Windows binaries start without third-party DLLs
        if: contains(matrix.platform.os_name, 'windows')
        shell: pwsh
        run: |
          & "target/${{ matrix.platform.target }}/release/hubuum-server.exe" --version
          & "target/${{ matrix.platform.target }}/release/hubuum-admin.exe" --version
      
      - name: Package release archive (Unix)
        if: contains(matrix.platform.os_name, 'macos')
        shell: bash
        run: |
          mkdir -p dist
          archive_name="hubuum-${{ matrix.platform.os_name }}-all-features-${GITHUB_REF_NAME}.tar.gz"
          tar czvf "dist/${archive_name}" -C "target/${{ matrix.platform.target }}/release" hubuum-server hubuum-admin
          cd dist
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
      
      - name: Package release archive (Windows)
        if: contains(matrix.platform.os_name, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $archive_name = "hubuum-${{ matrix.platform.os_name }}-full-release-${env:GITHUB_REF_NAME}.zip"
          Compress-Archive -Path "target/${{ matrix.platform.target }}/release/hubuum-server.exe", "target/${{ matrix.platform.target }}/release/hubuum-admin.exe" -DestinationPath "dist/$archive_name"
          $hash = (Get-FileHash "dist/$archive_name" -Algorithm SHA256).Hash.ToLower()
          # Keep checksum files portable: UTF-8 without a BOM and an explicit LF.
          $checksum = "$hash  $archive_name`n"
          [System.IO.File]::WriteAllText(
            "dist/$archive_name.sha256",
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )
          if ([System.IO.File]::ReadAllText("dist/$archive_name.sha256") -cne $checksum) {
            throw "Checksum file was not written exactly as expected"
          }
      
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform.os_name }}
          path: dist/*

  publish-github-release:
    name: Publish GitHub release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-tag-linux-artifacts.result == 'success' &&
      needs.build-tag-native-artifacts.result == 'success' &&
      needs.publish-tag-container-manifests.result == 'success'
    needs:
      - build-tag-linux-artifacts
      - build-tag-native-artifacts
      - publish-tag-container-manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Make release scripts executable
        run: chmod +x scripts/*.sh
      - name: Generate archive SBOMs and authoritative checksums
        shell: bash
        run: |
          while IFS= read -r -d '' archive; do
            archive_name="${archive#dist/}"
            cargo_args=()
            case "$archive_name" in
              *linux-x86_64*)
                cargo_args=(
                  "--cargo-target" "x86_64-unknown-linux-musl"
                  "--cargo-features" "production-all"
                  "--no-default-features"
                )
                ;;
              *linux-aarch64*)
                cargo_args=(
                  "--cargo-target" "aarch64-unknown-linux-musl"
                  "--cargo-features" "production-all"
                  "--no-default-features"
                )
                ;;
              *macos-aarch64*)
                cargo_args=(
                  "--cargo-target" "aarch64-apple-darwin"
                  "--cargo-features" "production-all"
                  "--no-default-features"
                )
                ;;
              *windows-x86_64*)
                cargo_args=(
                  "--cargo-target" "x86_64-pc-windows-msvc"
                  "--cargo-features"
                  "tls-rustls,amqp,email,valkey,embedded-migrations,vendored-openssl"
                )
                ;;
              *)
                echo "No Cargo build configuration for $archive_name" >&2
                exit 1
                ;;
            esac
            python3 scripts/generate-release-sbom.py \
              --artifact "$archive" \
              "${cargo_args[@]}" \
              --output "${archive}.cdx.json" \
              --source-revision "$GITHUB_SHA" \
              --source-tag "$GITHUB_REF_NAME" \
              --target "$archive_name"
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z)

          (
            cd dist
            while IFS= read -r -d '' artifact; do
              sha256sum "${artifact#./}"
            done < <(
              find . -maxdepth 1 -type f \
                \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.cdx.json' \) \
                -print0 | sort -z
            )
          ) > dist/release-checksums.txt
          (cd dist && sha256sum --check release-checksums.txt)
      - name: Record release build inputs
        shell: bash
        run: |
          lock_digest="$(sha256sum Cargo.lock | awk '{print $1}')"
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg lock_digest "sha256:${lock_digest}" \
            '{
              schema_version: 1,
              source_repository: $repository,
              source_revision: $revision,
              release_tag: $tag,
              workflow_identity: $workflow_ref,
              workflow_revision: $workflow_sha,
              builder: "GitHub-hosted runners",
              cargo_lock_digest: $lock_digest,
              targets: ["linux-amd64", "linux-arm64", "macos-arm64", "windows-amd64"],
              build_arguments: [
                "--no-default-features -F production-all --locked --release",
                "-F tls-rustls,amqp,email,valkey,embedded-migrations,vendored-openssl --locked --release"
              ]
            }' > dist/release-build-metadata.json
      - name: Attest release archive provenance
        id: native_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release-checksums.txt
      - name: Attest release build metadata
        id: native_build_metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release-checksums.txt
          predicate-type: https://hubuum.dev/attestations/release-build/v1
          predicate-path: dist/release-build-metadata.json
      - name: Retain native attestation bundles
        shell: bash
        run: |
          cp "${{ steps.native_provenance.outputs.bundle-path }}" dist/release-provenance.sigstore.json
          cp "${{ steps.native_build_metadata.outputs.bundle-path }}" dist/release-build-metadata.sigstore.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign the authoritative checksum manifest
        shell: bash
        run: |
          cosign_path="$(command -v cosign)"
          cosign_digest="$(sha256sum "$cosign_path" | awk '{print $1}')"
          cosign version
          echo "cosign executable sha256:${cosign_digest}"
          {
            echo "- cosign: \`v3.1.2\`"
            echo "- cosign executable: \`sha256:${cosign_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cosign sign-blob \
            --yes \
            --bundle dist/release-checksums.sigstore.json \
            dist/release-checksums.txt
      - name: Build release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/extract-changelog-section.sh "$version" > /tmp/release-notes.md
          test -s /tmp/release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Hubuum ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: /tmp/release-notes.md
          files: dist/*

  build-main-linux-artifacts:
    name: Build static main artifacts (${{ matrix.platform.os_name }}, ${{ matrix.feature.ext }})
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.artifacts == 'true'
    needs:
      - changes
      - ci-gate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            os_name: linux-x86_64
            runner: ubuntu-24.04
          - arch: arm64
            os_name: linux-aarch64
            runner: ubuntu-24.04-arm
        feature:
          - extra_args: "--no-default-features -F production-all"
            ext: all-features
          - extra_args: "--no-default-features"
            ext: no-tls
          - extra_args: "-F tls-openssl"
            ext: tls-openssl
          - extra_args: "-F tls-rustls"
            ext: tls-rustls
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Export stripped static binaries
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: release-artifacts
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=local,dest=dist/bin
          build-args: |
            CARGO_BUILD_FLAGS=${{ matrix.feature.extra_args }} --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=static-${{ matrix.platform.os_name }}-${{ matrix.feature.ext }}
          cache-to: type=gha,mode=max,scope=static-${{ matrix.platform.os_name }}-${{ matrix.feature.ext }}
      - name: Verify static linkage and package main archive
        shell: bash
        run: |
          for binary in dist/bin/hubuum-server dist/bin/hubuum-admin; do
            if readelf --dynamic "$binary" | grep --quiet '(NEEDED)'; then
              echo "$binary unexpectedly has dynamic runtime dependencies" >&2
              readelf --dynamic "$binary" >&2
              exit 1
            fi
            "$binary" --version
          done
          archive_name="hubuum-${{ matrix.platform.os_name }}-${{ matrix.feature.ext }}-main.tar.gz"
          tar czvf "dist/${archive_name}" -C dist/bin hubuum-server hubuum-admin
          cd dist
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
          shasum -a 256 -c "${archive_name}.sha256"
      - name: Upload main artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-${{ matrix.platform.os_name }}-${{ matrix.feature.ext }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  build-main-native-artifacts:
    name: Build native main artifacts (${{ matrix.platform.os_name }}, ${{ matrix.feature.ext }})
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.artifacts == 'true'
    needs:
      - changes
      - ci-gate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            os_name: windows-x86_64
            runner: windows-latest
          - target: aarch64-apple-darwin
            os_name: macos-aarch64
            runner: macos-latest
        feature:
          - extra_args: "--no-default-features -F production-all"
            ext: all-features
          - extra_args: "--no-default-features"
            ext: no-tls
          - extra_args: "-F tls-openssl"
            ext: tls-openssl
          - extra_args: "-F tls-rustls"
            ext: tls-rustls
        exclude:
          - platform: { os_name: windows-x86_64 }
            feature: { ext: tls-openssl }
          - platform: { os_name: windows-x86_64 }
            feature: { ext: all-features }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-04
      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.platform.target }}
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ${{ matrix.platform.target }}-stable-release
      - name: Build self-contained main binaries
        env:
          HUBUUM_BUILD_GIT_SHA: ${{ github.sha }}
        run: cargo build ${{ matrix.feature.extra_args }} -F embedded-migrations,vendored-openssl --locked --release --target ${{ matrix.platform.target }}
      - name: Verify macOS runtime dependencies
        if: contains(matrix.platform.os_name, 'macos')
        shell: bash
        run: |
          for binary in hubuum-server hubuum-admin; do
            binary_path="target/${{ matrix.platform.target }}/release/${binary}"
            "$binary_path" --version
            if xcrun otool -L "$binary_path" | grep --extended-regexp --quiet '(/opt/homebrew|/usr/local/opt|libpq|libssl|libcrypto)'; then
              echo "$binary unexpectedly depends on a package-manager library" >&2
              xcrun otool -L "$binary_path" >&2
              exit 1
            fi
          done
      - name: Verify Windows binaries start without third-party DLLs
        if: contains(matrix.platform.os_name, 'windows')
        shell: pwsh
        run: |
          & "target/${{ matrix.platform.target }}/release/hubuum-server.exe" --version
          & "target/${{ matrix.platform.target }}/release/hubuum-admin.exe" --version
      - name: Package main archive (macOS)
        if: contains(matrix.platform.os_name, 'macos')
        shell: bash
        run: |
          mkdir -p dist
          archive_name="hubuum-${{ matrix.platform.os_name }}-${{ matrix.feature.ext }}-main.tar.gz"
          tar czvf "dist/${archive_name}" -C "target/${{ matrix.platform.target }}/release" hubuum-server hubuum-admin
          cd dist
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
          shasum -a 256 -c "${archive_name}.sha256"
      - name: Package main archive (Windows)
        if: contains(matrix.platform.os_name, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $archive_name = "hubuum-${{ matrix.platform.os_name }}-${{ matrix.feature.ext }}-main.zip"
          Compress-Archive -Path "target/${{ matrix.platform.target }}/release/hubuum-server.exe", "target/${{ matrix.platform.target }}/release/hubuum-admin.exe" -DestinationPath "dist/$archive_name"
          $hash = (Get-FileHash "dist/$archive_name" -Algorithm SHA256).Hash.ToLower()
          # Keep checksum files portable: UTF-8 without a BOM and an explicit LF.
          $checksum = "$hash  $archive_name`n"
          [System.IO.File]::WriteAllText(
            "dist/$archive_name.sha256",
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )
          if ([System.IO.File]::ReadAllText("dist/$archive_name.sha256") -cne $checksum) {
            throw "Checksum file was not written exactly as expected"
          }
      - name: Upload main artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-${{ matrix.platform.os_name }}-${{ matrix.feature.ext }}
          path: dist/*

  publish-main-release:
    name: Publish main-latest artifacts
    if: github.ref == 'refs/heads/main'
    needs:
      - build-main-linux-artifacts
      - build-main-native-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download main artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: main-*
          merge-multiple: true
          path: dist
      - name: Publish main-latest release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: main-latest
          name: Main build
          body: Automatically published build for the `main` branch.
          draft: false
          prerelease: false
          files: dist/*

  publish-main-container-images:
    name: Build main container (${{ matrix.platform.arch }})
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.artifacts == 'true'
    needs:
      - changes
      - ci-gate
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform-specific image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hubuum-server:main-full-${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            CARGO_BUILD_FLAGS=-F tls-rustls -F tls-openssl --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate main container SBOM and vulnerability reports
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/hubuum-server"
          image_ref="${image}@${{ steps.build.outputs.digest }}"
          bash scripts/generate-container-evidence.sh \
            "$image_ref" \
            "main-${{ matrix.platform.arch }}" \
            "$GITHUB_SHA" \
            main \
            "linux-${{ matrix.platform.arch }}"
      - name: Retain main container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-container-evidence-${{ matrix.platform.arch }}
          path: supply-chain-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce final-image vulnerability policy
        shell: bash
        run: test "$(cat supply-chain-evidence/main-${{ matrix.platform.arch }}.scan-status)" = 0

  publish-main-container-manifests:
    name: Create main multi-arch manifest
    if: github.ref == 'refs/heads/main'
    needs: publish-main-container-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/hubuum-server"
          final_tags=("${image}:main" "${image}:main-full")
          
          # Create and push manifest for each tag
          for tag in "${final_tags[@]}"; do
            docker buildx imagetools create -t "$tag" \
              "${image}:main-full-amd64" \
              "${image}:main-full-arm64"
          done

  publish-tag-container-images:
    name: Build release container (${{ matrix.platform.arch }})
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.validate-tag-release.result == 'success'
    needs: validate-tag-release
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Make release scripts executable
        run: chmod +x scripts/*.sh
      - name: Check tagged release metadata
        run: ./scripts/check-release-readiness.sh "${GITHUB_REF_NAME}"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform-specific image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hubuum-server:${{ github.ref_name }}-full-${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            CARGO_BUILD_FLAGS=-F tls-rustls -F tls-openssl --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate release container SBOM and vulnerability reports
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/hubuum-server"
          image_ref="${image}@${{ steps.build.outputs.digest }}"
          bash scripts/generate-container-evidence.sh \
            "$image_ref" \
            "release-${{ matrix.platform.arch }}" \
            "$GITHUB_SHA" \
            "$GITHUB_REF_NAME" \
            "linux-${{ matrix.platform.arch }}"
      - name: Attest platform image provenance
        id: platform_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/hubuum-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest platform image SBOM
        id: platform_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/hubuum-server
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: supply-chain-evidence/release-${{ matrix.platform.arch }}.cdx.json
          push-to-registry: true
      - name: Collect platform attestation bundles
        if: always()
        shell: bash
        run: |
          cp "${{ steps.platform_provenance.outputs.bundle-path }}" \
            "supply-chain-evidence/release-${{ matrix.platform.arch }}.provenance.sigstore.json"
          cp "${{ steps.platform_sbom.outputs.bundle-path }}" \
            "supply-chain-evidence/release-${{ matrix.platform.arch }}.sbom.sigstore.json"
      - name: Retain release container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-container-evidence-${{ matrix.platform.arch }}
          path: supply-chain-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce final-image vulnerability policy
        shell: bash
        run: test "$(cat supply-chain-evidence/release-${{ matrix.platform.arch }}.scan-status)" = 0

  publish-tag-container-manifests:
    name: Create release multi-arch manifest
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-tag-container-images.result == 'success'
    needs: publish-tag-container-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        id: manifest
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/hubuum-server"
          version_tag="${GITHUB_REF_NAME}"
          version="${version_tag#v}"
          final_tags=(
            "${image}:${version_tag}"
            "${image}:${version}"
            "${image}:${version_tag}-full"
            "${image}:${version}-full"
          )
          
          # Create and push manifest for each tag
          for tag in "${final_tags[@]}"; do
            docker buildx imagetools create -t "$tag" \
              "${image}:${version_tag}-full-amd64" \
              "${image}:${version_tag}-full-arm64"
          done
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${image}:${version_tag}" | jq --raw-output '.digest')"
          test "$digest" != "null"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest release manifest provenance
        id: manifest_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign release manifest
        shell: bash
        run: |
          cosign_path="$(command -v cosign)"
          cosign_digest="$(sha256sum "$cosign_path" | awk '{print $1}')"
          cosign version
          echo "cosign executable sha256:${cosign_digest}"
          cosign sign --yes \
            "${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}"
          {
            echo "- Signed container manifest: \`${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}\`"
            echo "- cosign executable: \`sha256:${cosign_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain manifest provenance
        shell: bash
        run: |
          mkdir -p supply-chain-evidence
          cp "${{ steps.manifest_provenance.outputs.bundle-path }}" \
            supply-chain-evidence/release-manifest.provenance.sigstore.json
      - name: Upload manifest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-container-manifest-evidence
          path: supply-chain-evidence/
          if-no-files-found: error
          retention-days: 90
