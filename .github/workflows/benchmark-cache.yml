name: Benchmark cache maintenance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete the bounded set of obsolete benchmark entries
        default: false
        type: boolean
  schedule:
    - cron: "23 5 * * *"

concurrency:
  group: benchmark-cache-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Inventory and prune benchmark caches
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == true ]]; then
            args+=(--apply)
          fi
          python3 scripts/benchmark-cache.py "${args[@]}"
      - name: Retain cache inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-cache-inventory
          path: benchmark-cache-inventory.json
