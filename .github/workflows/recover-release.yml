name: Recover release

run-name: Recover ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable stable tag to recover
        required: true
        type: string

concurrency:
  group: recover-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify recovery prerequisites
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      main_run_id: ${{ steps.verify.outputs.main_run_id }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_run_id: ${{ steps.verify.outputs.tag_run_id }}
    steps:
      - name: Validate recovery request
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Recovery requires a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi

      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Resolve annotated tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "Recovery requires an existing annotated tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check release metadata at the tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-release-readiness.sh "$RELEASE_TAG"

      - name: Verify successful main and tag validation evidence
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.resolve.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${REPOSITORY}"
          encoded_tag="$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"

          main_runs="$RUNNER_TEMP/main-runs.json"
          curl --silent --show-error --fail \
            --header "$auth_header" \
            --header "$accept_header" \
            "${api_url}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${RELEASE_SHA}&status=completed&per_page=100" \
            > "$main_runs"
          main_run_id="$(
            jq --raw-output --arg sha "$RELEASE_SHA" '
              [
                .workflow_runs[]
                | select(
                    .head_branch == "main" and
                    .head_sha == $sha and
                    .conclusion == "success"
                  )
              ]
              | sort_by(.created_at)
              | last
              | .id // empty
            ' "$main_runs"
          )"
          if [[ -z "$main_run_id" ]]; then
            echo "No successful main CI run exists for ${RELEASE_SHA}" >&2
            exit 1
          fi

          tag_runs="$RUNNER_TEMP/tag-runs.json"
          curl --silent --show-error --fail \
            --header "$auth_header" \
            --header "$accept_header" \
            "${api_url}/actions/workflows/ci.yml/runs?event=push&branch=${encoded_tag}&head_sha=${RELEASE_SHA}&status=completed&per_page=100" \
            > "$tag_runs"
          tag_run_id="$(
            jq --raw-output --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '
              [
                .workflow_runs[]
                | select(
                    .head_branch == $tag and
                    .head_sha == $sha and
                    .conclusion == "success"
                  )
              ]
              | sort_by(.created_at)
              | last
              | .id // empty
            ' "$tag_runs"
          )"
          if [[ -z "$tag_run_id" ]]; then
            echo "No completed successful tag CI run exists for ${RELEASE_TAG} at ${RELEASE_SHA}" >&2
            exit 1
          fi

          tag_jobs="$RUNNER_TEMP/tag-jobs.json"
          curl --silent --show-error --fail \
            --header "$auth_header" \
            --header "$accept_header" \
            "${api_url}/actions/runs/${tag_run_id}/jobs?filter=latest&per_page=100" \
            > "$tag_jobs"
          required_jobs='[
            "Verify tagged commit already passed CI on main",
            "Rust dependency and license policy",
            "OpenAPI contract",
            "Container build (production features)"
          ]'
          if ! jq --exit-status --argjson required "$required_jobs" '
            .jobs as $jobs
            | all(
                $required[];
                . as $name
                | any($jobs[]; .name == $name and .conclusion == "success")
              )
          ' "$tag_jobs" > /dev/null; then
            echo "The tag run did not pass every required release prerequisite" >&2
            jq --argjson required "$required_jobs" '
              [.jobs[] | select(.name as $name | $required | index($name)) | {name, conclusion}]
            ' "$tag_jobs" >&2
            exit 1
          fi

          if ! jq --exit-status '
            any(.jobs[]; .name == "Validate tagged release" and .conclusion == "skipped") and
            any(.jobs[]; .name == "Publish GitHub release" and .conclusion == "skipped")
          ' "$tag_jobs" > /dev/null; then
            echo "The tag run is not an eligible skipped-publication recovery" >&2
            exit 1
          fi

          release_response="$RUNNER_TEMP/existing-release.json"
          release_status="$(
            curl --silent --show-error \
              --output "$release_response" \
              --write-out '%{http_code}' \
              --header "$auth_header" \
              --header "$accept_header" \
              "${api_url}/releases/tags/${encoded_tag}"
          )"
          if [[ "$release_status" == "200" ]]; then
            echo "GitHub Release ${RELEASE_TAG} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          if [[ "$release_status" != "404" ]]; then
            echo "Unexpected GitHub Release lookup status: ${release_status}" >&2
            cat "$release_response" >&2
            exit 1
          fi

          echo "main_run_id=$main_run_id" >> "$GITHUB_OUTPUT"
          echo "tag_run_id=$tag_run_id" >> "$GITHUB_OUTPUT"

  build-linux-artifacts:
    name: Recover static release artifacts (${{ matrix.platform.name }})
    needs: verify-release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux-x86_64
            arch: amd64
            os_name: linux-x86_64
            runner: ubuntu-24.04
          - name: Linux-aarch64
            arch: arm64
            os_name: linux-aarch64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Export stripped static binaries
        uses: docker/build-push-action@53b7df96c91f9d12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: release-artifacts
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=local,dest=dist/bin
          build-args: |
            CARGO_BUILD_FLAGS=--no-default-features --features production-all --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ needs.verify-release.outputs.release_sha }}
          cache-from: type=gha,scope=static-${{ matrix.platform.os_name }}-all-features
          cache-to: type=gha,mode=max,scope=static-${{ matrix.platform.os_name }}-all-features
      - name: Verify static linkage and package release archive
        shell: bash
        run: |
          for binary in dist/bin/hubuum-server dist/bin/hubuum-admin; do
            if readelf --dynamic "$binary" | grep --quiet '(NEEDED)'; then
              echo "$binary unexpectedly has dynamic runtime dependencies" >&2
              readelf --dynamic "$binary" >&2
              exit 1
            fi
            "$binary" --version
          done
          archive_name="hubuum-${{ matrix.platform.os_name }}-all-features-${RELEASE_TAG}.tar.gz"
          tar czvf "dist/${archive_name}" -C dist/bin hubuum-server hubuum-admin
          cd dist
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
          shasum -a 256 -c "${archive_name}.sha256"
      - name: Upload recovered release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-binary-${{ matrix.platform.os_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  build-native-artifacts:
    name: Recover native release artifacts (${{ matrix.platform.name }})
    needs: verify-release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x86_64
            target: x86_64-pc-windows-msvc
            os_name: windows-x86_64
            runner: windows-latest
          - name: macOS-ARM64
            target: aarch64-apple-darwin
            os_name: macos-aarch64
            runner: macos-latest
    env:
      RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-04
      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.platform.target }}
      - name: Cache cargo and target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ${{ matrix.platform.target }}-stable-release
      - name: Build release binaries on macOS
        if: contains(matrix.platform.os_name, 'macos')
        env:
          HUBUUM_BUILD_GIT_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: cargo build --no-default-features -F production-all --locked --release --target ${{ matrix.platform.target }}
      - name: Build release binaries on Windows
        if: contains(matrix.platform.os_name, 'windows')
        env:
          HUBUUM_BUILD_GIT_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: cargo build -F tls-rustls,amqp,email,valkey,embedded-migrations,vendored-openssl --locked --release --target ${{ matrix.platform.target }}
      - name: Verify macOS runtime dependencies
        if: contains(matrix.platform.os_name, 'macos')
        shell: bash
        run: |
          for binary in hubuum-server hubuum-admin; do
            binary_path="target/${{ matrix.platform.target }}/release/${binary}"
            "$binary_path" --version
            if xcrun otool -L "$binary_path" | grep --extended-regexp --quiet '(/opt/homebrew|/usr/local/opt|libpq|libssl|libcrypto)'; then
              echo "$binary unexpectedly depends on a package-manager library" >&2
              xcrun otool -L "$binary_path" >&2
              exit 1
            fi
          done
      - name: Verify Windows binaries start without third-party DLLs
        if: contains(matrix.platform.os_name, 'windows')
        shell: pwsh
        run: |
          & "target/${{ matrix.platform.target }}/release/hubuum-server.exe" --version
          & "target/${{ matrix.platform.target }}/release/hubuum-admin.exe" --version
      - name: Package release archive on macOS
        if: contains(matrix.platform.os_name, 'macos')
        shell: bash
        run: |
          mkdir -p dist
          archive_name="hubuum-${{ matrix.platform.os_name }}-all-features-${RELEASE_TAG}.tar.gz"
          tar czvf "dist/${archive_name}" -C "target/${{ matrix.platform.target }}/release" hubuum-server hubuum-admin
          cd dist
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
      - name: Package release archive on Windows
        if: contains(matrix.platform.os_name, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $archive_name = "hubuum-${{ matrix.platform.os_name }}-full-release-${env:RELEASE_TAG}.zip"
          Compress-Archive -Path "target/${{ matrix.platform.target }}/release/hubuum-server.exe", "target/${{ matrix.platform.target }}/release/hubuum-admin.exe" -DestinationPath "dist/$archive_name"
          $hash = (Get-FileHash "dist/$archive_name" -Algorithm SHA256).Hash.ToLower()
          $checksum = "$hash  $archive_name`n"
          [System.IO.File]::WriteAllText(
            "dist/$archive_name.sha256",
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )
          if ([System.IO.File]::ReadAllText("dist/$archive_name.sha256") -cne $checksum) {
            throw "Checksum file was not written exactly as expected"
          }
      - name: Upload recovered release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-binary-${{ matrix.platform.os_name }}
          path: dist/*

  publish-github-release:
    name: Recover GitHub release
    needs:
      - verify-release
      - build-linux-artifacts
      - build-native-artifacts
      - publish-container-manifest
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      MAIN_RUN_ID: ${{ needs.verify-release.outputs.main_run_id }}
      RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
      TAG_RUN_ID: ${{ needs.verify-release.outputs.tag_run_id }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
      - name: Download recovered release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: recovery-binary-*
          merge-multiple: true
          path: dist
      - name: Make release scripts executable
        run: chmod +x scripts/*.sh
      - name: Generate archive SBOMs and authoritative checksums
        shell: bash
        run: |
          while IFS= read -r -d '' archive; do
            archive_name="${archive#dist/}"
            cargo_args=()
            case "$archive_name" in
              *linux-x86_64*)
                cargo_args=(
                  "--cargo-target" "x86_64-unknown-linux-musl"
                  "--cargo-features" "production-all"
                  "--no-default-features"
                )
                ;;
              *linux-aarch64*)
                cargo_args=(
                  "--cargo-target" "aarch64-unknown-linux-musl"
                  "--cargo-features" "production-all"
                  "--no-default-features"
                )
                ;;
              *macos-aarch64*)
                cargo_args=(
                  "--cargo-target" "aarch64-apple-darwin"
                  "--cargo-features" "production-all"
                  "--no-default-features"
                )
                ;;
              *windows-x86_64*)
                cargo_args=(
                  "--cargo-target" "x86_64-pc-windows-msvc"
                  "--cargo-features"
                  "tls-rustls,amqp,email,valkey,embedded-migrations,vendored-openssl"
                )
                ;;
              *)
                echo "No Cargo build configuration for $archive_name" >&2
                exit 1
                ;;
            esac
            python3 scripts/generate-release-sbom.py \
              --artifact "$archive" \
              "${cargo_args[@]}" \
              --output "${archive}.cdx.json" \
              --source-revision "$RELEASE_SHA" \
              --source-tag "$RELEASE_TAG" \
              --target "$archive_name"
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z)

          (
            cd dist
            while IFS= read -r -d '' artifact; do
              sha256sum "${artifact#./}"
            done < <(
              find . -maxdepth 1 -type f \
                \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.cdx.json' \) \
                -print0 | sort -z
            )
          ) > dist/release-checksums.txt
          (cd dist && sha256sum --check release-checksums.txt)
      - name: Record release recovery inputs
        shell: bash
        run: |
          lock_digest="$(sha256sum Cargo.lock | awk '{print $1}')"
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$RELEASE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg lock_digest "sha256:${lock_digest}" \
            --arg main_run_id "$MAIN_RUN_ID" \
            --arg tag_run_id "$TAG_RUN_ID" \
            '{
              schema_version: 1,
              source_repository: $repository,
              source_revision: $revision,
              release_tag: $tag,
              workflow_identity: $workflow_ref,
              workflow_revision: $workflow_sha,
              recovery: {
                reason: "tag publication gate was skipped after prerequisites passed",
                successful_main_run_id: $main_run_id,
                validated_tag_run_id: $tag_run_id
              },
              builder: "GitHub-hosted runners",
              cargo_lock_digest: $lock_digest,
              targets: ["linux-amd64", "linux-arm64", "macos-arm64", "windows-amd64"],
              build_arguments: [
                "--no-default-features -F production-all --locked --release",
                "-F tls-rustls,amqp,email,valkey,embedded-migrations,vendored-openssl --locked --release"
              ]
            }' > dist/release-build-metadata.json
      - name: Attest release archive provenance
        id: native_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release-checksums.txt
      - name: Attest release build metadata
        id: native_build_metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release-checksums.txt
          predicate-type: https://hubuum.dev/attestations/release-build/v1
          predicate-path: dist/release-build-metadata.json
      - name: Retain native attestation bundles
        shell: bash
        run: |
          cp "${{ steps.native_provenance.outputs.bundle-path }}" dist/release-provenance.sigstore.json
          cp "${{ steps.native_build_metadata.outputs.bundle-path }}" dist/release-build-metadata.sigstore.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign the authoritative checksum manifest
        shell: bash
        run: |
          cosign_path="$(command -v cosign)"
          cosign_digest="$(sha256sum "$cosign_path" | awk '{print $1}')"
          cosign version
          echo "cosign executable sha256:${cosign_digest}"
          {
            echo "- Recovery workflow: \`${GITHUB_WORKFLOW_REF}\`"
            echo "- cosign: \`v3.1.2\`"
            echo "- cosign executable: \`sha256:${cosign_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cosign sign-blob \
            --yes \
            --bundle dist/release-checksums.sigstore.json \
            dist/release-checksums.txt
      - name: Build release notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          ./scripts/extract-changelog-section.sh "$version" > /tmp/release-notes.md
          test -s /tmp/release-notes.md
      - name: Publish recovered GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.verify-release.outputs.tag }}
          name: Hubuum ${{ needs.verify-release.outputs.tag }}
          draft: false
          prerelease: false
          body_path: /tmp/release-notes.md
          files: dist/*

  build-container-images:
    name: Recover release container (${{ matrix.platform.arch }})
    needs: verify-release
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
      - name: Make release scripts executable
        run: chmod +x scripts/*.sh
      - name: Check tagged release metadata
        run: ./scripts/check-release-readiness.sh "$RELEASE_TAG"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform-specific image
        id: build
        uses: docker/build-push-action@53b7df96c91f9d12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hubuum-server:${{ needs.verify-release.outputs.tag }}-full-${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-release.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.tag }}
          build-args: |
            CARGO_BUILD_FLAGS=-F tls-rustls -F tls-openssl --locked --release
            HUBUUM_BUILD_GIT_SHA=${{ needs.verify-release.outputs.release_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate release container SBOM and vulnerability reports
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/hubuum-server"
          image_ref="${image}@${{ steps.build.outputs.digest }}"
          bash scripts/generate-container-evidence.sh \
            "$image_ref" \
            "release-${{ matrix.platform.arch }}" \
            "$RELEASE_SHA" \
            "$RELEASE_TAG" \
            "linux-${{ matrix.platform.arch }}"
      - name: Attest platform image provenance
        id: platform_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/hubuum-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest platform image SBOM
        id: platform_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/hubuum-server
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: supply-chain-evidence/release-${{ matrix.platform.arch }}.cdx.json
          push-to-registry: true
      - name: Collect platform attestation bundles
        if: always()
        shell: bash
        run: |
          cp "${{ steps.platform_provenance.outputs.bundle-path }}" \
            "supply-chain-evidence/release-${{ matrix.platform.arch }}.provenance.sigstore.json"
          cp "${{ steps.platform_sbom.outputs.bundle-path }}" \
            "supply-chain-evidence/release-${{ matrix.platform.arch }}.sbom.sigstore.json"
      - name: Retain release container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-container-evidence-${{ matrix.platform.arch }}
          path: supply-chain-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce final-image vulnerability policy
        shell: bash
        run: test "$(cat supply-chain-evidence/release-${{ matrix.platform.arch }}.scan-status)" = 0

  publish-container-manifest:
    name: Recover release multi-arch manifest
    needs:
      - verify-release
      - build-container-images
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-architecture manifest
        id: manifest
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/hubuum-server"
          version="${RELEASE_TAG#v}"
          final_tags=(
            "${image}:${RELEASE_TAG}"
            "${image}:${version}"
            "${image}:${RELEASE_TAG}-full"
            "${image}:${version}-full"
          )

          for tag in "${final_tags[@]}"; do
            docker buildx imagetools create -t "$tag" \
              "${image}:${RELEASE_TAG}-full-amd64" \
              "${image}:${RELEASE_TAG}-full-arm64"
          done
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${image}:${RELEASE_TAG}" | jq --raw-output '.digest')"
          test "$digest" != "null"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest release manifest provenance
        id: manifest_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign release manifest
        shell: bash
        run: |
          cosign_path="$(command -v cosign)"
          cosign_digest="$(sha256sum "$cosign_path" | awk '{print $1}')"
          cosign version
          echo "cosign executable sha256:${cosign_digest}"
          cosign sign --yes \
            "${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}"
          {
            echo "- Recovery workflow: \`${GITHUB_WORKFLOW_REF}\`"
            echo "- Signed container manifest: \`${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}\`"
            echo "- cosign executable: \`sha256:${cosign_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain manifest provenance
        shell: bash
        run: |
          mkdir -p supply-chain-evidence
          cp "${{ steps.manifest_provenance.outputs.bundle-path }}" \
            supply-chain-evidence/release-manifest.provenance.sigstore.json
      - name: Upload manifest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-container-manifest-evidence
          path: supply-chain-evidence/
          if-no-files-found: error
          retention-days: 90

  recovery-gate:
    name: Recovery publication gate
    if: always()
    needs:
      - verify-release
      - publish-github-release
      - publish-container-manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Require every recovery stage to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
