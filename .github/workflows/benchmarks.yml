name: Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scopes:
        description: Scopes (auto, all, or comma-separated micro,postgres,runtime,resources)
        default: auto
        type: string
      base_sha:
        description: Base revision for manual comparisons (defaults to main)
        default: main
        type: string
      tags:
        description: Comma-separated subject tags; unioned with explicit scopes/targets
        default: ""
        type: string
      targets:
        description: Comma-separated canonical backend:manifest:target identities
        default: ""
        type: string
      profile:
        description: Measurement effort (scope remains independent)
        default: standard
        type: choice
        options: [quick, standard, thorough]
      warm_only:
        description: Only warm all benchmark executables on main
        default: false
        type: boolean
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ci:full' &&
      github.event.label.name != 'ci:benchmarks' &&
      !startsWith(github.event.label.name, 'ci:bench:') &&
      format('ignored-label-{0}', github.event.label.name) ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Resolve benchmark scopes tags and profile
    if: >-
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && !inputs.warm_only)) &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ci:full' || github.event.label.name == 'ci:benchmarks' ||
       startsWith(github.event.label.name, 'ci:bench:'))
    runs-on: ubuntu-24.04
    outputs:
      run_benchmarks: ${{ steps.policy.outputs.run_benchmarks }}
      run_runtime: ${{ steps.policy.outputs.run_runtime }}
      run_resources: ${{ steps.policy.outputs.run_resources }}
      selection: ${{ steps.policy.outputs.selection }}
      base_sha: ${{ steps.policy.outputs.base_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Resolve performance selection
        id: policy
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            BASE_SHA="$(git rev-parse --verify --end-of-options "${BASE_SHA}^{commit}" 2>/dev/null || git rev-parse --verify --end-of-options "origin/${BASE_SHA}^{commit}")"
            export BASE_SHA
            echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          fi
          bash scripts/ci-changed-paths.sh > "$RUNNER_TEMP/benchmark-changed-paths"
          python3 scripts/benchmark-policy.py --paths "$RUNNER_TEMP/benchmark-changed-paths" --output selection.json
      - name: Retain performance selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-selection-${{ github.run_attempt }}
          path: selection.json

  benchmark-lanes:
    name: Discover independent benchmark lanes
    needs: [changes, warm-cache-changes]
    if: >-
      !cancelled() &&
      (needs.changes.outputs.run_benchmarks == 'true' ||
       needs.warm-cache-changes.outputs.benchmarks == 'true')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
      has_targets: ${{ steps.lanes.outputs.has_targets }}
      config: ${{ steps.lanes.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.warm_only)
        with:
          ref: ${{ needs.changes.outputs.base_sha }}
          path: .benchmark-base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: terjekv/rust-pr-bench
          ref: 7c25e2f52947680c432441707958ab254aa5e27e
          path: .benchmark-action
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Partition discovered benchmarks, preserving moved baselines
        id: lanes
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.warm_only) }}
          SELECTION_JSON: ${{ needs.changes.outputs.selection }}
        run: |
          args=(--action-path .benchmark-action --head .)
          if [[ "$IS_PULL_REQUEST" == "true" ]]; then
            args+=(--base .benchmark-base)
          fi
          if [[ -n "$SELECTION_JSON" ]]; then
            args+=(--selection-json "$SELECTION_JSON")
          fi
          python3 scripts/benchmark-lanes.py "${args[@]}" > target-selection.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          matrix = json.loads(Path("target-selection.json").read_text())
          policy = json.loads(Path(".github/benchmark-policy.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write("has_targets=" + str(bool(matrix["include"])).lower() + "\n")
              output.write("config=" + json.dumps({"version": 1, "profiles": policy["profiles"]}, separators=(",", ":")) + "\n")
          PYTHON
      - name: Retain selected targets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-target-selection-${{ github.run_attempt }}
          path: target-selection.json

  benchmarks:
    name: Benchmarks (${{ matrix.name }})
    needs: [changes, benchmark-lanes]
    if: >-
      !cancelled() &&
      needs.benchmark-lanes.result == 'success' &&
      needs.changes.outputs.run_benchmarks == 'true' &&
      needs.benchmark-lanes.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmark-lanes.outputs.matrix) }}
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@7c25e2f52947680c432441707958ab254aa5e27e # target selection and profiles (rust-pr-bench#32)
    secrets: inherit
    with:
      # Keep build/cache inputs aligned with warm-cache below.
      action_ref: 7c25e2f52947680c432441707958ab254aa5e27e
      backend: all
      base_sha: ${{ needs.changes.outputs.base_sha }}
      benchmarks_json: ${{ toJSON(matrix.benchmarks) }}
      auto_detect_moved_benchmarks: true
      cargo_args: --locked
      cache: true
      cache_namespace: ${{ matrix.cache_namespace }}
      cache_binaries: true
      cache_save_build: false
      benchmark_config_json: ${{ needs.benchmark-lanes.outputs.config }}
      select_targets_json: ${{ toJSON(matrix.selected_targets) }}
      profile: ${{ fromJSON(needs.changes.outputs.selection).profile }}
      criterion_statistic: median
      # Apply the same bounded sampling budget to both revisions and every lane.
      criterion_cli_args: "--noplot --sample-size 20 --warm-up-time 1 --measurement-time 2 --nresamples 10000"
      regression_threshold_pct_gungraun: 3
      regression_threshold_pct_criterion: 50
      fail_on_regression: ${{ fromJSON(needs.changes.outputs.selection).profile != 'quick' }}
      comment_mode: never

  warm-cache-changes:
    name: Classify benchmark cache inputs
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.warm_only))
    runs-on: ubuntu-24.04
    outputs:
      benchmarks: ${{ steps.paths.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Classify cache inputs
        id: paths
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          bash scripts/ci-changed-paths.sh > "$RUNNER_TEMP/cache-changed-paths"
          changed_files=()
          while IFS= read -r -d '' path; do
            changed_files+=("$path")
          done < "$RUNNER_TEMP/cache-changed-paths"
          bash scripts/classify-ci-changes.sh "${changed_files[@]}"

  warm-cache:
    needs: [warm-cache-changes, benchmark-lanes]
    name: Warm benchmark caches on main (${{ matrix.name }})
    if: >-
      !cancelled() &&
      needs.benchmark-lanes.result == 'success' &&
      needs.benchmark-lanes.outputs.has_targets == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.warm_only)) &&
      needs.warm-cache-changes.outputs.benchmarks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmark-lanes.outputs.matrix) }}
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@7c25e2f52947680c432441707958ab254aa5e27e # target selection and profiles (rust-pr-bench#32)
    with:
      action_ref: 7c25e2f52947680c432441707958ab254aa5e27e
      backend: all
      benchmarks_json: ${{ toJSON(matrix.benchmarks) }}
      auto_detect_moved_benchmarks: true
      cargo_args: --locked
      cache: true
      cache_namespace: ${{ matrix.cache_namespace }}
      cache_binaries: true
      compile_only: true
      benchmark_config_json: ${{ needs.benchmark-lanes.outputs.config }}
      comment_mode: never

  runtime-limits:
    name: Template and schema resource evidence
    needs: changes
    if: needs.changes.outputs.run_resources == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install application build dependencies
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes libpq-dev libssl-dev
      - name: Cache Cargo and target directories
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build the isolated renderer
        run: cargo build --locked --release -p hubuum-templates --bin hubuum-template-worker
      - name: Measure concurrent templates and schema validation
        shell: bash
        run: cargo bench --locked --features runtime-limit-bench --bench template_schema_concurrency | tee template-schema-evidence.jsonl
      - name: Verify schema budgets under process resource limits
        shell: bash
        run: python3 tests/python/run.py integration schema-budget --release | tee -a template-schema-evidence.jsonl
      - name: Retain template and schema measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-schema-evidence
          path: template-schema-evidence.jsonl

  runtime-behavior:
    name: Runtime behavior validation
    needs: changes
    if: needs.changes.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_runtime_base
      HEAD_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_runtime_head
      CARGO_TARGET_DIR: target
      RUNTIME_BEHAVIOR_REPORT_DIR: target/runtime-behavior
      RUNTIME_BEHAVIOR_SAMPLE_SECONDS: 60
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache Cargo and target directories
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Verify PostgreSQL build tools
        run: |
          command -v pg_config
          pkg-config --exists libpq
      - name: Create isolated runtime validation databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --username postgres hubuum_runtime_base
          createdb --host localhost --username postgres hubuum_runtime_head
          mkdir -p "$RUNTIME_BEHAVIOR_REPORT_DIR"
      - name: Detect an existing base runtime validator
        id: base_runtime
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          if git cat-file -e "$BASE_SHA:src/bin/runtime_behavior_check.rs" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure base runtime behavior
        if: steps.base_runtime.outputs.available == 'true'
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --legacy-single-role-migration \
            --database-url "$BASE_DATABASE_URL"
          cargo build --locked --features runtime-behavior-check --bin hubuum-server
          cargo run --profile dev --locked --features runtime-behavior-check \
            --bin hubuum-runtime-behavior-check -- measure \
            --server-binary target/debug/hubuum-server \
            --database-url "$BASE_DATABASE_URL" \
            --sample-seconds "$RUNTIME_BEHAVIOR_SAMPLE_SECONDS" \
            --primary-port 18080 \
            --standby-port 18081 \
            --label "$BASE_SHA" \
            --output "$RUNTIME_BEHAVIOR_REPORT_DIR/base.json"
      - name: Measure pull-request runtime behavior
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --legacy-single-role-migration \
            --database-url "$HEAD_DATABASE_URL"
          cargo build --locked --features runtime-behavior-check --bin hubuum-server
          cargo run --profile dev --locked --features runtime-behavior-check \
            --bin hubuum-runtime-behavior-check -- measure \
            --server-binary target/debug/hubuum-server \
            --database-url "$HEAD_DATABASE_URL" \
            --sample-seconds "$RUNTIME_BEHAVIOR_SAMPLE_SECONDS" \
            --primary-port 18080 \
            --standby-port 18081 \
            --label "$HEAD_SHA" \
            --output "$RUNTIME_BEHAVIOR_REPORT_DIR/head.json"
      - name: Assess runtime behavior
        env:
          BASE_AVAILABLE: ${{ steps.base_runtime.outputs.available }}
        run: |
          base_args=()
          if [[ "$BASE_AVAILABLE" == "true" ]]; then
            base_args=(--base "$RUNTIME_BEHAVIOR_REPORT_DIR/base.json")
          fi
          cargo run --profile dev --locked --features runtime-behavior-check \
            --bin hubuum-runtime-behavior-check -- assess \
            --head "$RUNTIME_BEHAVIOR_REPORT_DIR/head.json" \
            "${base_args[@]}" \
            --markdown-output "$GITHUB_STEP_SUMMARY" \
            --max-primary-background-db-per-second 1.9 \
            --max-standby-background-db-per-second 1.2 \
            --max-aggregate-background-db-per-second 3.0 \
            --max-task-idle-per-second 0.25 \
            --max-fanout-poll-per-second 0.25 \
            --max-restore-db-per-second 1.1 \
            --max-task-worker-db-per-idle-iteration 2.25 \
            --max-fanout-db-per-poll-wakeup 1.1 \
            --max-notification-latency-ms 1000 \
            --max-task-claim-latency-ms 1000 \
            --max-relative-regression-percent 25
      - name: Upload runtime behavior reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-behavior
          path: target/runtime-behavior
