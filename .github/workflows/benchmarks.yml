name: Benchmarks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ci:full' &&
      github.event.label.name != 'ci:benchmarks' &&
      format('ignored-label-{0}', github.event.label.name) ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Classify benchmark changes
    if: >-
      (
        github.event.pull_request.draft == false ||
        contains(github.event.pull_request.labels.*.name, 'ci:full') ||
        contains(github.event.pull_request.labels.*.name, 'ci:benchmarks')
      ) &&
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ci:full' ||
        github.event.label.name == 'ci:benchmarks'
      )
    runs-on: ubuntu-24.04
    outputs:
      run_self_contained: ${{ steps.policy.outputs.run_self_contained }}
      run_postgres: ${{ steps.policy.outputs.run_postgres }}
      run_runtime: ${{ steps.policy.outputs.run_runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test change classifier
        run: bash scripts/test-classify-ci-changes.sh
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files=()
          while IFS= read -r -d '' path; do
            changed_files+=("$path")
          done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA")
          bash scripts/classify-ci-changes.sh "${changed_files[@]}"
      - name: Select benchmark tier
        id: policy
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          FORCE_BENCHMARKS: ${{ contains(github.event.pull_request.labels.*.name, 'ci:benchmarks') }}
          SELF_CONTAINED_CHANGED: ${{ steps.paths.outputs.benchmarks }}
          POSTGRES_CHANGED: ${{ steps.paths.outputs.postgres_benchmark }}
          RUNTIME_CHANGED: ${{ steps.paths.outputs.runtime_benchmark }}
        run: |
          requested=false
          if [[ "$IS_DRAFT" != "true" || "$FORCE_FULL" == "true" || "$FORCE_BENCHMARKS" == "true" ]]; then
            requested=true
          fi

          force_all=false
          if [[ "$FORCE_FULL" == "true" || "$FORCE_BENCHMARKS" == "true" ]]; then
            force_all=true
          fi

          run_self_contained=false
          run_postgres=false
          run_runtime=false
          if [[ "$requested" == "true" ]]; then
            if [[ "$force_all" == "true" || "$SELF_CONTAINED_CHANGED" == "true" ]]; then
              run_self_contained=true
            fi
            if [[ "$force_all" == "true" || "$POSTGRES_CHANGED" == "true" ]]; then
              run_postgres=true
            fi
            if [[ "$force_all" == "true" || "$RUNTIME_CHANGED" == "true" ]]; then
              run_runtime=true
            fi
          fi

          {
            echo "run_self_contained=$run_self_contained"
            echo "run_postgres=$run_postgres"
            echo "run_runtime=$run_runtime"
          } >> "$GITHUB_OUTPUT"

  benchmarks:
    name: Self-contained benchmarks
    needs: changes
    if: needs.changes.outputs.run_self_contained == 'true'
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@0343a98c94e04d326c5fbfea753fad9934eee7be # v1.0.0
    secrets: inherit
    with:
      action_ref: 0343a98c94e04d326c5fbfea753fad9934eee7be
      backend: all
      auto_discover: true
      auto_detect_moved_benchmarks: true
      criterion_statistic: median
      criterion_cli_args: "--noplot --sample-size 40 --measurement-time 4"
      regression_threshold_pct_gungraun: 3
      regression_threshold_pct_criterion: 50
      fail_on_regression: true
      feature_sets_json: >-
        [
          {"name":"default","features":""}
        ]

  postgres-storage:
    name: PostgreSQL storage benchmarks
    needs: changes
    if: needs.changes.outputs.run_postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_bench_base
      HEAD_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_bench_head
      CARGO_TARGET_DIR: target
      POSTGRES_BENCH_WARNING_PCT: 10
      POSTGRES_BENCH_FAILURE_PCT: 20
      POSTGRES_BENCH_FAILURE_ABSOLUTE_NS: 25000
      POSTGRES_BENCH_STABILITY_PCT: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Cache Cargo and target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install PostgreSQL build tools
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes libpq-dev
      - name: Disable nondeterministic PostgreSQL background work
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname postgres \
            --command "ALTER SYSTEM SET checkpoint_timeout = '30min'"
          psql --host localhost --username postgres --dbname postgres \
            --command "ALTER SYSTEM SET autovacuum = 'off'"
          psql --host localhost --username postgres --dbname postgres \
            --command "SELECT pg_reload_conf()"
          autovacuum="$(
            psql --host localhost --username postgres --dbname postgres \
              --tuples-only --no-align --command "SELECT current_setting('autovacuum')"
          )"
          [[ "$autovacuum" == "off" ]]
      - name: Create isolated benchmark databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --username postgres hubuum_bench_base
          createdb --host localhost --username postgres hubuum_bench_head
      - name: Clear cached PostgreSQL benchmark results
        run: rm -rf target/criterion/storage_postgres
      - name: Detect an existing base benchmark
        id: base_benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:benches/postgres/storage_postgres_criterion.rs" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Record base benchmark
        if: steps.base_benchmark.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HUBUUM_BENCH_DATABASE_URL: ${{ env.BASE_DATABASE_URL }}
        run: |
          git checkout --detach "$BASE_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --database-url "$BASE_DATABASE_URL"
          cargo bench --locked --features postgres-bench \
            --bench storage_postgres_criterion -- \
            --save-baseline pr-base --noplot --sample-size 40 --measurement-time 4
      - name: Record and compare pull-request benchmark
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HUBUUM_BENCH_DATABASE_URL: ${{ env.HEAD_DATABASE_URL }}
          BASE_AVAILABLE: ${{ steps.base_benchmark.outputs.available }}
        run: |
          git checkout --detach "$HEAD_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --database-url "$HEAD_DATABASE_URL"
          if [[ "$BASE_AVAILABLE" == "true" ]]; then
            cargo bench --locked --features postgres-bench \
              --bench storage_postgres_criterion -- \
              --baseline-lenient pr-base --noplot --sample-size 40 --measurement-time 4
          else
            cargo bench --locked --features postgres-bench \
              --bench storage_postgres_criterion -- \
              --save-baseline initial --noplot --sample-size 40 --measurement-time 4
            echo "Initial PostgreSQL storage baseline recorded; base comparison starts after merge." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Assess initial PostgreSQL regressions
        if: steps.base_benchmark.outputs.available == 'true'
        id: initial_assessment
        env:
          POSTGRES_BENCH_INITIAL_FAILURES: ${{ runner.temp }}/postgres-benchmark-initial-failures.txt
          POSTGRES_BENCH_INITIAL_RESULTS: ${{ runner.temp }}/postgres-criterion-initial
        run: |
          set +e
          scripts/check-criterion-regressions.sh \
            target/criterion/storage_postgres \
            "$POSTGRES_BENCH_WARNING_PCT" \
            "$POSTGRES_BENCH_FAILURE_PCT" \
            "$POSTGRES_BENCH_FAILURE_ABSOLUTE_NS" \
            forward warning "$POSTGRES_BENCH_INITIAL_FAILURES" "" pr-base
          assessment_status=$?
          set -e

          case "$assessment_status" in
            0)
              echo "suspected=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              cp -R target/criterion/storage_postgres "$POSTGRES_BENCH_INITIAL_RESULTS"
              echo "suspected=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$assessment_status"
              ;;
          esac
      - name: Confirm PostgreSQL regressions in reverse order
        if: steps.initial_assessment.outputs.suspected == 'true'
        env:
          PGPASSWORD: postgres
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIRMED_FAILURES: ${{ runner.temp }}/postgres-benchmark-confirmed-failures.txt
          POSTGRES_BENCH_INITIAL_FAILURES: ${{ runner.temp }}/postgres-benchmark-initial-failures.txt
          POSTGRES_BENCH_INITIAL_RESULTS: ${{ runner.temp }}/postgres-criterion-initial
        run: |
          dropdb --host localhost --username postgres --if-exists --force hubuum_bench_base
          dropdb --host localhost --username postgres --if-exists --force hubuum_bench_head
          createdb --host localhost --username postgres hubuum_bench_base
          createdb --host localhost --username postgres hubuum_bench_head
          rm -rf target/criterion/storage_postgres

          git checkout --detach "$HEAD_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --database-url "$HEAD_DATABASE_URL"
          HUBUUM_BENCH_DATABASE_URL="$HEAD_DATABASE_URL" \
            cargo bench --locked --features postgres-bench \
              --bench storage_postgres_criterion -- \
              --save-baseline pr-head-confirmation \
              --noplot --sample-size 40 --measurement-time 4

          git checkout --detach "$BASE_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --database-url "$BASE_DATABASE_URL"
          HUBUUM_BENCH_DATABASE_URL="$BASE_DATABASE_URL" \
            cargo bench --locked --features postgres-bench \
              --bench storage_postgres_criterion -- \
              --baseline-lenient pr-head-confirmation \
              --noplot --sample-size 40 --measurement-time 4

          git checkout --detach "$HEAD_SHA"
          set +e
          scripts/check-criterion-regressions.sh \
            target/criterion/storage_postgres \
            "$POSTGRES_BENCH_WARNING_PCT" \
            "$POSTGRES_BENCH_FAILURE_PCT" \
            "$POSTGRES_BENCH_FAILURE_ABSOLUTE_NS" \
            reverse warning "$CONFIRMED_FAILURES" \
            "$POSTGRES_BENCH_INITIAL_FAILURES" pr-head-confirmation
          confirmation_status=$?
          set -e

          if [[ "$confirmation_status" -eq 2 ]]; then
            exit 2
          fi
          if [[ "$confirmation_status" -eq 0 ]]; then
            echo "::warning title=Inconclusive PostgreSQL benchmark::The reverse-order comparison did not reproduce the initial regression."
            echo "The PostgreSQL benchmark was noisy: its reverse-order confirmation did not reproduce the initial regression." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          scripts/check-criterion-stability.sh \
            "$POSTGRES_BENCH_INITIAL_RESULTS" \
            target/criterion/storage_postgres \
            "$POSTGRES_BENCH_STABILITY_PCT" \
            "$CONFIRMED_FAILURES" pr-base
          stability_status=$?
          set -e

          if [[ "$stability_status" -eq 2 ]]; then
            exit 2
          fi
          if [[ "$stability_status" -eq 1 ]]; then
            echo "The PostgreSQL benchmark was inconclusive because its bracketing base measurements were unstable." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          scripts/check-criterion-regressions.sh \
            target/criterion/storage_postgres \
            "$POSTGRES_BENCH_WARNING_PCT" \
            "$POSTGRES_BENCH_FAILURE_PCT" \
            "$POSTGRES_BENCH_FAILURE_ABSOLUTE_NS" \
            reverse warning "" "$CONFIRMED_FAILURES" pr-head-confirmation
          report_status=$?
          set -e

          case "$report_status" in
            0)
              ;;
            1)
              echo "::warning title=PostgreSQL timing regression::A repeatable wall-clock regression was detected. Deterministic query-budget, query-plan, and Gungraun checks remain the required performance gates."
              echo "A repeatable PostgreSQL wall-clock regression was detected. This timing result is informational; deterministic performance checks remain required." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit "$report_status"
              ;;
          esac

  runtime-behavior:
    name: Runtime behavior benchmark
    needs: changes
    if: needs.changes.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_runtime_base
      HEAD_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hubuum_runtime_head
      CARGO_TARGET_DIR: target
      RUNTIME_BEHAVIOR_REPORT_DIR: target/runtime-behavior
      RUNTIME_BEHAVIOR_SAMPLE_SECONDS: 60
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Cache Cargo and target directories
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install PostgreSQL build tools
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes libpq-dev
      - name: Create isolated runtime benchmark databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --username postgres hubuum_runtime_base
          createdb --host localhost --username postgres hubuum_runtime_head
          mkdir -p "$RUNTIME_BEHAVIOR_REPORT_DIR"
      - name: Detect an existing base runtime benchmark
        id: base_runtime
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:benches/runtime_behavior.rs" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure base runtime behavior
        if: steps.base_runtime.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --database-url "$BASE_DATABASE_URL"
          cargo build --locked --features runtime-behavior-bench --bin hubuum-server
          cargo bench --profile dev --locked --features runtime-behavior-bench \
            --bench runtime_behavior -- measure \
            --server-binary target/debug/hubuum-server \
            --database-url "$BASE_DATABASE_URL" \
            --sample-seconds "$RUNTIME_BEHAVIOR_SAMPLE_SECONDS" \
            --primary-port 18080 \
            --standby-port 18081 \
            --label "$BASE_SHA" \
            --output "$RUNTIME_BEHAVIOR_REPORT_DIR/base.json"
      - name: Measure pull-request runtime behavior
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          cargo run --locked --features embedded-migrations --bin hubuum-admin -- \
            --migrate --database-url "$HEAD_DATABASE_URL"
          cargo build --locked --features runtime-behavior-bench --bin hubuum-server
          cargo bench --profile dev --locked --features runtime-behavior-bench \
            --bench runtime_behavior -- measure \
            --server-binary target/debug/hubuum-server \
            --database-url "$HEAD_DATABASE_URL" \
            --sample-seconds "$RUNTIME_BEHAVIOR_SAMPLE_SECONDS" \
            --primary-port 18080 \
            --standby-port 18081 \
            --label "$HEAD_SHA" \
            --output "$RUNTIME_BEHAVIOR_REPORT_DIR/head.json"
      - name: Assess runtime behavior
        env:
          BASE_AVAILABLE: ${{ steps.base_runtime.outputs.available }}
        run: |
          base_args=()
          if [[ "$BASE_AVAILABLE" == "true" ]]; then
            base_args=(--base "$RUNTIME_BEHAVIOR_REPORT_DIR/base.json")
          fi
          cargo bench --profile dev --locked --features runtime-behavior-bench \
            --bench runtime_behavior -- assess \
            --head "$RUNTIME_BEHAVIOR_REPORT_DIR/head.json" \
            "${base_args[@]}" \
            --markdown-output "$GITHUB_STEP_SUMMARY" \
            --max-primary-background-db-per-second 1.9 \
            --max-standby-background-db-per-second 1.2 \
            --max-aggregate-background-db-per-second 3.0 \
            --max-task-idle-per-second 0.25 \
            --max-fanout-poll-per-second 0.25 \
            --max-restore-db-per-second 1.1 \
            --max-task-worker-db-per-idle-iteration 2.25 \
            --max-fanout-db-per-poll-wakeup 1.1 \
            --max-notification-latency-ms 1000 \
            --max-task-claim-latency-ms 1000 \
            --max-relative-regression-percent 25
      - name: Upload runtime behavior reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-behavior
          path: target/runtime-behavior
