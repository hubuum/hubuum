name: Portable regex fuzzing

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-regex-fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify fuzz inputs
    runs-on: ubuntu-24.04
    outputs:
      regex_fuzz: ${{ steps.paths.outputs.regex_fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Select affected fuzz targets
        id: paths
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ALWAYS_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$ALWAYS_RUN" == true || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'regex_fuzz=true' >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changed-paths.sh > "$RUNNER_TEMP/fuzz-changed-paths"
            paths=()
            while IFS= read -r -d '' path; do
              paths+=("$path")
            done < "$RUNNER_TEMP/fuzz-changed-paths"
            bash scripts/classify-ci-changes.sh "${paths[@]}"
          fi

  fuzz:
    name: Portable regex parser and native matching
    needs: changes
    if: needs.changes.outputs.regex_fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-29
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/fuzz/target
      FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '45' }}
      HUBUUM_REGEX_FUZZ_DATABASE_URL: postgres://postgres:regex-fuzz@127.0.0.1:5432/hubuum_regex_fuzz
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: hubuum_regex_fuzz
          POSTGRES_PASSWORD: regex-fuzz
        ports:
          - 5432:5432
        options: >-
          --memory=1g --cpus=2
          --health-cmd "pg_isready -U postgres -d hubuum_regex_fuzz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libpq-dev libssl-dev pkg-config
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "fuzz -> target"
          shared-key: portable-regex-fuzz
      - name: Install pinned cargo-fuzz
        run: |
          if [[ "$(cargo fuzz --version 2>/dev/null || true)" != 'cargo-fuzz 0.13.2' ]]; then
            cargo install cargo-fuzz --version '=0.13.2' --locked
          fi
      - name: Fetch locked dependencies and verify harness
        run: |
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path fuzz/Cargo.toml --lib --test limits --locked
      - name: Audit standalone fuzz dependencies
        run: bash scripts/run-cargo-deny.sh "$RUNNER_TEMP/regex-fuzz-deny.log" fuzz/Cargo.toml
      - name: Seed from the portable contract and retained regressions
        run: cargo run --manifest-path fuzz/Cargo.toml --example seed --locked
      - name: Fuzz parser invariants
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo fuzz run regex_pattern --fuzz-dir fuzz --codegen-units 16 -- \
            -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=1536 -max_len=2048 \
            -dict="$PWD/fuzz/regex.dict"
      - name: Fuzz native PostgreSQL and memory equivalence
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo fuzz run regex_backends --fuzz-dir fuzz --features postgres --codegen-units 16 -- \
            -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=1536 -max_len=2049 \
            -dict="$PWD/fuzz/regex.dict"
      - name: Verify the lockfile stayed unchanged
        run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Retain synthetic corpora and failure inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regex-fuzz-${{ github.run_id }}
          path: |
            fuzz/corpus
            fuzz/artifacts
            fuzz/Cargo.lock
            ${{ runner.temp }}/regex-fuzz-deny.log
          retention-days: 30
          if-no-files-found: error
