name: Windows template worker

on:
  pull_request:
    paths:
      - ".github/workflows/template-worker-windows.yml"
      - "crates/hubuum-templates/**"
      - "crates/hubuum-budget/**"

permissions:
  contents: read

concurrency:
  group: windows-template-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render in the Windows AppContainer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-22
        with:
          toolchain: stable
      - run: cargo test --locked -p hubuum-templates --test isolation packaged_worker_renders_with_the_service_environment
