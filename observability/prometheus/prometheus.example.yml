# Replace private targets and labels. Never scrape an application load balancer.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/hubuum/recording-rules.json
  - /etc/prometheus/hubuum/alerts.json
scrape_configs:
  - job_name: hubuum
    static_configs:
      - targets: [api-primary.internal:8080]
        labels:
          deployment: production
          instance: api-primary
      - targets: [api-standby.internal:8080]
        labels:
          deployment: production
          instance: api-standby
      - targets: [worker.internal:8080]
        labels:
          deployment: production
          instance: worker
  # Optional blackbox exporter. Keep target URLs out of instance labels.
  - job_name: hubuum-readiness
    metrics_path: /probe
    params:
      module: [hubuum_http_ready]
    static_configs:
      - targets: [http://api-primary.internal:8080/readyz]
        labels:
          deployment: production
          instance: api-primary
      - targets: [http://api-standby.internal:8080/readyz]
        labels:
          deployment: production
          instance: api-standby
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter.internal:9115
  # Optional node exporter with the supplied operator-job textfiles.
  - job_name: hubuum-operator-jobs
    static_configs:
      - targets: [node-exporter.internal:9100]
        labels:
          instance: recovery-host
