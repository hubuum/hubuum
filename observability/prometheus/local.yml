global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.json
  - /etc/prometheus/recording-rules.json
scrape_configs:
  - job_name: hubuum
    static_configs:
      - targets: [hubuum:8080]
        labels:
          deployment: local
          instance: hubuum
